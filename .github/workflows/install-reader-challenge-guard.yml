name: Install Reader Challenge Guard

on:
  push:
    branches: [op-watch-v1-test]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[install-reader-guard]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: op-watch-v1-test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install semantic guard
        run: node scripts/patch-reader-challenge-guard.cjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Commit validated guard
        shell: bash
        run: |
          if git diff --quiet -- src/audit.ts; then
            echo "No guard change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audit.ts
          git commit -m "fix(audit): reject Reader-wrapped anti-bot pages"
          git push origin HEAD:op-watch-v1-test
