name: OP Watch Three-Store Final Proof One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Gate
        working-directory: .
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: final proof Oupi Philibert Otakuland green" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Derive private token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Force Philibert and Otakuland real cycles
        shell: bash
        run: |
          set -euo pipefail
          for store in philibert otakuland; do
            curl -fsS --max-time 150 \
              -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST --data "{\"action\":\"runStoreNow\",\"store\":\"$store\"}" \
              "$PRODUCTION_URL/cockpit/api/control" > "/tmp/$store.json"
            STORE="$store" node - <<'NODE'
          const store=process.env.STORE;
          const x=require(`/tmp/${store}.json`);
          const row=(x.cycle?.stores||[]).find(s=>s.store===store);
          console.log(JSON.stringify({store,status:row?.status,durationMs:row?.durationMs,merchantDurationMs:row?.merchantDurationMs,error:row?.error},null,2));
          if(!x.ok||row?.status!=='completed') process.exit(2);
          NODE
          done
      - name: Require Oupi Philibert Otakuland GREEN in production cockpit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/status.json
          node - <<'NODE'
          const s=require('/tmp/status.json');
          const wanted=['oupi','philibert','otakuland'];
          const rows=(s.stores||[]).filter(x=>wanted.includes(x.key)).map(x=>({key:x.key,level:x.level,label:x.label,runtimeStatus:x.runtimeStatus,candidates:x.candidates,lastCheck:x.lastCheck,sourceKind:x.sourceKind,detail:x.detail}));
          console.log(JSON.stringify({runtime:s.runtime,totals:s.totals,stores:rows},null,2));
          if(s.runtime?.live!==true||rows.length!==3||rows.some(x=>x.level!=='green'||x.runtimeStatus!=='completed')) process.exit(3);
          NODE
      - name: Independent Cloudflare LIVE proof
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          curl -fsS -H "$auth" "$base/settings" > /tmp/settings.json
          curl -fsS -H "$auth" "$base/schedules" > /tmp/schedules.json
          node - <<'NODE'
          const settings=require('/tmp/settings.json');
          const schedules=require('/tmp/schedules.json');
          const bindings=settings.result?.bindings||[];
          const plain=Object.fromEntries(bindings.filter(b=>b.type==='plain_text').map(b=>[b.name,b.text]));
          const names=new Set(bindings.map(b=>b.name));
          const sched=Array.isArray(schedules.result)?schedules.result:(schedules.result?.schedules||[]);
          const crons=sched.map(x=>x.cron||x.schedule).filter(Boolean);
          const proof={monitoring:plain.MONITORING_ENABLED,writeState:plain.WRITE_STATE,discordMode:plain.DISCORD_MODE,schedulerMode:plain.SCHEDULER_MODE,runtimeTest:plain.RUNTIME_TEST_MODE,discordSecret:names.has('DISCORD_WEBHOOK_URL'),storeDO:names.has('STORE_MONITORS'),calendarDO:names.has('CALENDAR_COORDINATOR'),crons};
          console.log(JSON.stringify(proof,null,2));
          if(proof.monitoring!=='true'||proof.writeState!=='true'||proof.discordMode!=='live'||proof.schedulerMode!=='live'||proof.runtimeTest==='true'||!proof.discordSecret||!proof.storeDO||!proof.calendarDO||!crons.includes('* * * * *')) process.exit(4);
          NODE
