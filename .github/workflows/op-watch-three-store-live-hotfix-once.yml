name: OP Watch FINAL Three-Store LIVE Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: deploy and prove final three-store cadence" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate exact main
        run: npm run typecheck && npm test && npx wrangler deploy --dry-run
      - name: Derive private token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DISCORD_WEBHOOK_URL"
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Generate and assert LIVE config
        run: |
          npm run generate-production-config
          node -e "const c=require('./wrangler.production-live.generated.json'); const b=c.durable_objects?.bindings||[]; if(c.name!=='tcg-watch-one-piece'||c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE==='true'||JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])||b.length!==2) process.exit(1)"
        env:
          PRODUCTION_PHASE: live
      - name: Deploy exact LIVE code
        run: npx wrangler deploy --config wrangler.production-live.generated.json
      - name: Restore private readiness secret
        run: printf '%s' "$PREVIEW_AUDIT_TOKEN" | npx wrangler secret put PREVIEW_AUDIT_TOKEN --config wrangler.production-live.generated.json
      - name: Restore Discord secret
        run: printf '%s' "$DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL --config wrangler.production-live.generated.json
      - name: Wait for LIVE readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl -fsS --max-time 20 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready" > /tmp/ready.json; then
              if node -e "const x=require('/tmp/ready.json'); process.exit(x.status==='ready'&&x.mode==='live'&&x.monitoringEnabled===true&&x.stateWritesEnabled===true&&x.discordMode==='live'&&x.schedulerMode==='live'?0:1)"; then
                cat /tmp/ready.json
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
      - name: Force fresh Discovery for Philibert and Otakuland
        shell: bash
        run: |
          set -euo pipefail
          for store in philibert otakuland; do
            curl -fsS --max-time 150 \
              -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST --data "{\"action\":\"runStoreNow\",\"store\":\"$store\"}" \
              "$PRODUCTION_URL/cockpit/api/control" > "/tmp/$store.json"
            STORE="$store" node - <<'NODE'
          const store=process.env.STORE;
          const x=require(`/tmp/${store}.json`);
          const row=(x.cycle?.stores||[]).find(s=>s.store===store);
          console.log(JSON.stringify({store,status:row?.status,durationMs:row?.durationMs,merchantDurationMs:row?.merchantDurationMs,error:row?.error},null,2));
          if(!x.ok||row?.status!=='completed') process.exit(2);
          NODE
          done
      - name: Record Discovery timestamps
        shell: bash
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/before.json
          node - <<'NODE'
          const s=require('/tmp/before.json');
          const rows=Object.fromEntries((s.stores||[]).filter(x=>['oupi','philibert','otakuland'].includes(x.key)).map(x=>[x.key,{lastCheck:x.lastCheck,level:x.level,sourceKind:x.sourceKind,runtimeStatus:x.runtimeStatus,candidates:x.candidates}]));
          console.log(JSON.stringify(rows,null,2));
          require('fs').writeFileSync('/tmp/philibert-before.txt', rows.philibert?.lastCheck||'');
          NODE
      - name: Prove scheduled Fast Watch takes over without Philibert RSS
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat /tmp/philibert-before.txt)"
          for attempt in {1..24}; do
            sleep 10
            curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/after.json
            if BEFORE="$before" node - <<'NODE'
          const s=require('/tmp/after.json');
          const rows=(s.stores||[]).filter(x=>['oupi','philibert','otakuland'].includes(x.key));
          const p=rows.find(x=>x.key==='philibert');
          const ok=s.runtime?.live===true && rows.length===3 && rows.every(x=>x.level==='green'&&x.runtimeStatus==='completed') && p?.sourceKind==='public_html' && p?.lastCheck && p.lastCheck!==process.env.BEFORE;
          if(!ok) process.exit(1);
          console.log(JSON.stringify({runtime:s.runtime,totals:s.totals,stores:rows.map(x=>({key:x.key,level:x.level,runtimeStatus:x.runtimeStatus,sourceKind:x.sourceKind,candidates:x.candidates,lastCheck:x.lastCheck,detail:x.detail}))},null,2));
          NODE
            then
              exit 0
            fi
          done
          echo "Le Fast Watch planifié n'a pas produit la preuve attendue dans le délai." >&2
          cat /tmp/after.json || true
          exit 3
      - name: Independent Cloudflare LIVE proof
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          curl -fsS -H "$auth" "$base/settings" > /tmp/settings.json
          curl -fsS -H "$auth" "$base/schedules" > /tmp/schedules.json
          node - <<'NODE'
          const settings=require('/tmp/settings.json');
          const schedules=require('/tmp/schedules.json');
          const bindings=settings.result?.bindings||[];
          const plain=Object.fromEntries(bindings.filter(b=>b.type==='plain_text').map(b=>[b.name,b.text]));
          const names=new Set(bindings.map(b=>b.name));
          const sched=Array.isArray(schedules.result)?schedules.result:(schedules.result?.schedules||[]);
          const crons=sched.map(x=>x.cron||x.schedule).filter(Boolean);
          const proof={monitoring:plain.MONITORING_ENABLED,writeState:plain.WRITE_STATE,discordMode:plain.DISCORD_MODE,schedulerMode:plain.SCHEDULER_MODE,runtimeTest:plain.RUNTIME_TEST_MODE,discordSecret:names.has('DISCORD_WEBHOOK_URL'),storeDO:names.has('STORE_MONITORS'),calendarDO:names.has('CALENDAR_COORDINATOR'),crons};
          console.log(JSON.stringify(proof,null,2));
          if(proof.monitoring!=='true'||proof.writeState!=='true'||proof.discordMode!=='live'||proof.schedulerMode!=='live'||proof.runtimeTest==='true'||!proof.discordSecret||!proof.storeDO||!proof.calendarDO||!crons.includes('* * * * *')) process.exit(4);
          NODE
