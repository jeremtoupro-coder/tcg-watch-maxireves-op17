name: OP Watch Three-Store LIVE Proof One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard proof gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: prove three-store live health via cockpit" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Derive private runtime token
        shell: bash
        run: |
          set -euo pipefail
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Require LIVE readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready" > /tmp/ready.json
          node - <<'NODE'
          const x=require('/tmp/ready.json');
          console.log(JSON.stringify(x,null,2));
          if(x.status!=='ready'||x.mode!=='live'||x.monitoringEnabled!==true||x.stateWritesEnabled!==true||x.discordMode!=='live'||x.schedulerMode!=='live') process.exit(1);
          NODE
      - name: Force fresh real Discovery for Oupi Philibert Otakuland
        shell: bash
        run: |
          set -euo pipefail
          for store in oupi philibert otakuland; do
            echo "=== $store ==="
            curl -fsS --max-time 180 \
              -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST --data "{\"action\":\"runStoreNow\",\"store\":\"$store\"}" \
              "$PRODUCTION_URL/cockpit/api/control" > "/tmp/$store.json"
            STORE="$store" node - <<'NODE'
          const store=process.env.STORE;
          const x=require(`/tmp/${store}.json`);
          const row=(x.cycle?.stores||[]).find(s=>s.store===store);
          console.log(JSON.stringify({store,ok:x.ok,status:row?.status,durationMs:row?.durationMs,merchantDurationMs:row?.merchantDurationMs,error:row?.error},null,2));
          if(!x.ok||row?.status!=='completed') process.exit(2);
          NODE
          done
      - name: Require all three green in production cockpit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/status.json
          node - <<'NODE'
          const s=require('/tmp/status.json');
          if(s.runtime?.live!==true) throw new Error('runtime not live');
          const wanted=['oupi','philibert','otakuland'];
          const rows=(s.stores||[]).filter(x=>wanted.includes(x.key)).map(x=>({key:x.key,level:x.level,label:x.label,runtimeStatus:x.runtimeStatus,candidates:x.candidates,lastCheck:x.lastCheck,detail:x.detail}));
          console.log(JSON.stringify({runtime:s.runtime,totals:s.totals,stores:rows},null,2));
          if(rows.length!==3||rows.some(x=>x.level!=='green'||x.runtimeStatus!=='completed')) process.exit(3);
          NODE
      - name: Verify Cloudflare LIVE state independently
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          curl -fsS -H "$auth" "$base/settings" > /tmp/settings.json
          curl -fsS -H "$auth" "$base/schedules" > /tmp/schedules.json
          node - <<'NODE'
          const settings=require('/tmp/settings.json');
          const schedules=require('/tmp/schedules.json');
          const b=settings.result?.bindings||[];
          const p=Object.fromEntries(b.filter(x=>x.type==='plain_text').map(x=>[x.name,x.text]));
          const n=new Set(b.map(x=>x.name));
          const rows=Array.isArray(schedules.result)?schedules.result:(schedules.result?.schedules||[]);
          const crons=rows.map(x=>x.cron||x.schedule).filter(Boolean);
          const proof={monitoring:p.MONITORING_ENABLED,write:p.WRITE_STATE,discord:p.DISCORD_MODE,scheduler:p.SCHEDULER_MODE,runtimeTest:p.RUNTIME_TEST_MODE,storeDO:n.has('STORE_MONITORS'),calendarDO:n.has('CALENDAR_COORDINATOR'),discordSecret:n.has('DISCORD_WEBHOOK_URL'),crons};
          console.log(JSON.stringify(proof,null,2));
          if(proof.monitoring!=='true'||proof.write!=='true'||proof.discord!=='live'||proof.scheduler!=='live'||proof.runtimeTest==='true'||!proof.storeDO||!proof.calendarDO||!proof.discordSecret||!crons.includes('* * * * *')) process.exit(4);
          NODE
