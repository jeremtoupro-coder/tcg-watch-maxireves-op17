name: OP Watch Three-Store LIVE Verification One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard verification gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: verify three-store hotfix live" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive private readiness token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Require production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready" > /tmp/ready.json
          node - <<'NODE'
          const x=require('/tmp/ready.json');
          console.log(JSON.stringify(x,null,2));
          if(x.readiness!=='PASS' && x.ready!==true) process.exit(1);
          NODE
      - name: Force real Discovery for Oupi Philibert Otakuland
        shell: bash
        run: |
          set -euo pipefail
          for store in oupi philibert otakuland; do
            echo "=== $store ==="
            curl -fsS --max-time 150 \
              -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST --data "{\"action\":\"runStoreNow\",\"store\":\"$store\"}" \
              "$PRODUCTION_URL/cockpit/api/control" > "/tmp/$store.json"
            STORE="$store" node - <<'NODE'
          const store=process.env.STORE;
          const x=require(`/tmp/${store}.json`);
          if(!x.ok) throw new Error(`${store}: control not ok`);
          const row=(x.cycle?.stores||[]).find(s=>s.store===store);
          console.log(JSON.stringify({store,status:row?.status,durationMs:row?.durationMs,merchantDurationMs:row?.merchantDurationMs},null,2));
          if(row?.status!=='completed') throw new Error(`${store}: ${row?.status||'missing'}`);
          NODE
          done
      - name: Require three green stores in production cockpit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/status.json
          node - <<'NODE'
          const s=require('/tmp/status.json');
          if(s.runtime?.live!==true) throw new Error('runtime not live');
          const wanted=['oupi','philibert','otakuland'];
          const rows=(s.stores||[]).filter(x=>wanted.includes(x.key)).map(x=>({key:x.key,level:x.level,label:x.label,runtimeStatus:x.runtimeStatus,candidates:x.candidates,lastCheck:x.lastCheck,detail:x.detail}));
          console.log(JSON.stringify({runtime:s.runtime,totals:s.totals,stores:rows},null,2));
          if(rows.length!==3 || rows.some(x=>x.level!=='green'||x.runtimeStatus!=='completed')) process.exit(2);
          NODE
      - name: Verify Cloudflare recorded LIVE configuration independently
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          curl -fsS -H "$auth" "$base/settings" > /tmp/settings.json
          curl -fsS -H "$auth" "$base/schedules" > /tmp/schedules.json
          node - <<'NODE'
          const settings=require('/tmp/settings.json');
          const schedules=require('/tmp/schedules.json');
          const bindings=settings.result?.bindings||[];
          const plain=Object.fromEntries(bindings.filter(b=>b.type==='plain_text').map(b=>[b.name,b.text]));
          const names=new Set(bindings.map(b=>b.name));
          const rows=Array.isArray(schedules.result)?schedules.result:(schedules.result?.schedules||[]);
          const crons=rows.map(x=>x.cron||x.schedule).filter(Boolean);
          const proof={monitoring:plain.MONITORING_ENABLED,writeState:plain.WRITE_STATE,discordMode:plain.DISCORD_MODE,schedulerMode:plain.SCHEDULER_MODE,runtimeTest:plain.RUNTIME_TEST_MODE,hasDiscordSecret:names.has('DISCORD_WEBHOOK_URL'),hasStoreDO:names.has('STORE_MONITORS'),hasCalendarDO:names.has('CALENDAR_COORDINATOR'),crons};
          console.log(JSON.stringify(proof,null,2));
          if(proof.monitoring!=='true'||proof.writeState!=='true'||proof.discordMode!=='live'||proof.schedulerMode!=='live'||proof.runtimeTest==='true'||!proof.hasDiscordSecret||!proof.hasStoreDO||!proof.hasCalendarDO||!crons.includes('* * * * *')) process.exit(3);
          NODE
