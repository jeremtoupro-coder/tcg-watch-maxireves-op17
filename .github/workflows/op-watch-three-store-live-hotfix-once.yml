name: OP Watch Oupi Diagnostic One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
    steps:
      - name: Gate
        working-directory: .
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: diagnose Oupi transient failure live" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Derive token and force Oupi
        shell: bash
        run: |
          set -euo pipefail
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
          curl -sS --max-time 150 \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -X POST --data '{"action":"runStoreNow","store":"oupi"}' \
            "$PRODUCTION_URL/cockpit/api/control" > /tmp/oupi-control.json || true
      - name: Print sanitized Oupi health and source errors
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/cockpit/api/status" > /tmp/status.json
          node - <<'NODE'
          const fs=require('fs');
          let control={}; try{control=JSON.parse(fs.readFileSync('/tmp/oupi-control.json','utf8')||'{}')}catch{}
          const status=require('/tmp/status.json');
          const row=(status.stores||[]).find(x=>x.key==='oupi');
          const cycleRow=(control.cycle?.stores||[]).find(x=>x.store==='oupi');
          console.log(JSON.stringify({cockpit:row,cycle:cycleRow?{store:cycleRow.store,status:cycleRow.status,durationMs:cycleRow.durationMs,merchantDurationMs:cycleRow.merchantDurationMs,error:cycleRow.error}:null},null,2));
          if(!row) process.exit(1);
          NODE
