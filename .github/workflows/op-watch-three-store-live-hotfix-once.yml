name: OP Watch Oupi LIVE Source Diagnostic One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-three-store-live-hotfix-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
    steps:
      - name: Hard diagnostic gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: inspect Oupi live source details final" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Derive private runtime token
        shell: bash
        run: |
          set -euo pipefail
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Require LIVE readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready" > /tmp/ready.json
          node - <<'NODE'
          const x=require('/tmp/ready.json');
          if(x.status!=='ready'||x.mode!=='live'||x.monitoringEnabled!==true||x.stateWritesEnabled!==true||x.discordMode!=='live'||x.schedulerMode!=='live') process.exit(1);
          console.log('LIVE readiness OK');
          NODE
      - name: Force one Oupi Discovery and print nested source details
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 \
            -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST --data '{"action":"runStoreNow","store":"oupi"}' \
            "$PRODUCTION_URL/cockpit/api/control" > /tmp/oupi.json
          node - <<'NODE'
          const x=require('/tmp/oupi.json');
          const row=(x.cycle?.stores||[]).find(s=>s.store==='oupi');
          const result=row?.result||{};
          const audit=(result.audits||[]).find(a=>a.store==='oupi');
          const sources=(audit?.sources||[]).map(s=>({
            sourceUrl:s.sourceUrl,
            finalUrl:s.finalUrl||null,
            status:s.status??null,
            durationMs:s.durationMs??null,
            responseBytes:s.responseBytes??null,
            productLinksSeen:s.productLinksSeen??null,
            candidates:s.candidates?.length??0,
            error:s.error||null
          }));
          const degraded=(result.degradedStores||[]).find(s=>s.store==='oupi');
          console.log(JSON.stringify({
            status:row?.status,
            durationMs:row?.durationMs,
            merchantDurationMs:row?.merchantDurationMs,
            auditRuntimeStatus:audit?.runtimeStatus,
            candidates:audit?.candidates?.length??0,
            degradedErrors:degraded?.errors||[],
            sources
          },null,2));
          if(!row) process.exit(2);
          NODE
