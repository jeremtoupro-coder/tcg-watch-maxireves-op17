name: Cloudflare Audit CI

on:
  push:
    branches:
      - cloudflare-workers-audit
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-audit-ci.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-audit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

  audit-pilot:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[audit-pilot]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Read-only audit of the four pilot stores
        run: npm run live-audit
      - name: Upload pilot audit report
        uses: actions/upload-artifact@v4
        with:
          name: op-watch-v1-pilot-audit
          path: cloudflare-worker/audit-report.json
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[deploy-preview]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Generate KV-aware deployment config
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
      - name: Deploy safe preview
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed preview
        run: npm run smoke-preview
        env:
          PREVIEW_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      - name: Probe Oupi through deployed Worker runtime
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev/opwatch/v1/oupi-probe';
          const response = await fetch(url);
          const data = await response.json();
          console.log(JSON.stringify(data, null, 2));
          const successful = Array.isArray(data.results)
            ? data.results.filter((item) => item.ok && item.status === 200 && item.hasOnePiece)
            : [];
          if (successful.length === 0) {
            throw new Error('Aucun accès Oupi HTTP 200 confirmé depuis le runtime Cloudflare.');
          }
          console.log(`Oupi accessible depuis Cloudflare: ${successful.length} probe(s) OK.`);
          NODE
      - name: Verify actual Oupi connector in Worker runtime
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev/opwatch/v1/oupi-audit';
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Oupi audit endpoint HTTP ${response.status}`);
          const data = await response.json();
          const audit = data.audit;
          if (!audit || audit.store !== 'oupi') throw new Error('Audit Oupi absent ou invalide.');

          const configuredCategoryPaths = [
            '/fr/413-precommande-one-piece',
            '/fr/414-display-one-piece',
            '/fr/513-case-scelle-de-display',
            '/fr/415-starter-deck-one-piece',
            '/fr/417-collection-pack-speciaux-one-piece'
          ];
          for (const path of configuredCategoryPaths) {
            const source = (audit.sources || []).find((item) => new URL(item.sourceUrl).pathname === path);
            if (!source) throw new Error(`Source Oupi absente: ${path}`);
            if (source.error || source.status !== 200) {
              throw new Error(`Source Oupi dégradée ${path}: ${source.error || source.status}`);
            }
          }

          const failed = (audit.sources || []).filter((source) => source.error || source.status !== 200);
          if (failed.length) throw new Error(`Source Oupi dégradée: ${JSON.stringify(failed)}`);

          const displayUrl = 'https://oupi.eu/fr/display-one-piece/7367-display-op-17-boite-de-booster-francais-one-piece-card-game.html';
          const caseUrl = 'https://oupi.eu/fr/case-scelle-de-display/7368-case-scellee-de-12-display-op-17-francais-one-piece-card-game.html';
          const byUrl = new Map((audit.candidates || []).map((candidate) => [candidate.url, candidate]));
          const display = byUrl.get(displayUrl);
          const sealedCase = byUrl.get(caseUrl);

          if (!display) throw new Error('Display OP17 FR Oupi non détecté.');
          if (!sealedCase) throw new Error('Case OP17 FR Oupi non détectée.');

          for (const [label, candidate, expectedUrl] of [
            ['display', display, displayUrl],
            ['case', sealedCase, caseUrl]
          ]) {
            if (candidate.language !== 'Français confirmé') {
              throw new Error(`${label} OP17 mal classé en langue: ${candidate.language}`);
            }
            if (candidate.sourceUrl !== expectedUrl) {
              throw new Error(`${label} OP17 non vérifié sur sa fiche directe: ${candidate.sourceUrl}`);
            }
            if (candidate.availability !== 'unavailable') {
              throw new Error(`${label} OP17 faux positif stock: attendu unavailable, reçu ${candidate.availability}`);
            }
          }

          const directDisplaySource = (audit.sources || []).find((source) => source.sourceUrl === displayUrl);
          const directCaseSource = (audit.sources || []).find((source) => source.sourceUrl === caseUrl);
          if (!directDisplaySource || directDisplaySource.status !== 200 || directDisplaySource.error) {
            throw new Error('La fiche directe du display OP17 n’a pas été relue avec succès.');
          }
          if (!directCaseSource || directCaseSource.status !== 200 || directCaseSource.error) {
            throw new Error('La fiche directe de la case OP17 n’a pas été relue avec succès.');
          }

          const englishMisclassified = (audit.candidates || []).filter((candidate) =>
            /anglais|english/i.test(candidate.title || '') && candidate.language === 'Français confirmé'
          );
          if (englishMisclassified.length) {
            throw new Error(`Produit anglais classé FR: ${JSON.stringify(englishMisclassified)}`);
          }

          console.log(JSON.stringify({
            result: 'OUPI_DIRECT_PAGE_TRUTH_VALIDATED',
            categories200: configuredCategoryPaths.length,
            display: { availability: display.availability, direct: display.sourceUrl === display.url },
            case: { availability: sealedCase.availability, direct: sealedCase.sourceUrl === sealedCase.url },
            englishMisclassified: englishMisclassified.length,
            totalSources: audit.sources.length,
            totalCandidates: audit.candidates.length
          }, null, 2));
          NODE

  seed-baseline:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[seed-baseline]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Seed silent baseline in Cloudflare KV
        run: npm run seed-baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: tcg-kv-baseline-report
          path: cloudflare-worker/baseline-report.json
          if-no-files-found: error
          retention-days: 7

  simulate-change:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[simulate-change]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Simulate a real KV return in stock
        run: npm run simulate-change
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: tcg-change-simulation-report
          path: cloudflare-worker/change-simulation-report.json
          if-no-files-found: error
          retention-days: 7

  deploy-live:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[deploy-live]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Ensure all silent baselines exist
        run: npm run seed-baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
      - name: Generate live deployment config
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "true"
          DEPLOY_WRITE_STATE: "true"
          DEPLOY_DISCORD_MODE: live
          DEPLOY_CRON: "* * * * *"
      - name: Install Discord secret in Cloudflare
        run: printf '%s' "$DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Deploy live monitoring
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
