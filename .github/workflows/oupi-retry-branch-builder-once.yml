name: Oupi Retry Branch Builder One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oupi-retry-branch-builder-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hard gate
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: rebuild Oupi retry branch with fresh 503 mocks" ]
      - uses: actions/checkout@v4
        with:
          ref: fix-oupi-transient-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Patch retry policy and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/audit.ts')
          s=p.read_text()
          start=s.index('async function fetchSource(')
          end=s.index('\nfunction allowedDiscoveryHosts', start)
          replacement=r'''async function fetchSource(sourceUrl: string, connector: ConnectorDefinition, watchProducts: OfficialProduct[]): Promise<SourceAudit> {
            const started = performance.now();
            const attempts = connector.key === "oupi" ? 2 : 1;
            let lastAudit: SourceAudit | undefined;

            for (let attempt = 0; attempt < attempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
              let status: number | undefined;
              let finalUrl: string | undefined;
              let contentType: string | undefined;
              let responseBytes: number | undefined;

              try {
                const response = await fetch(sourceUrl, {
                  method: "GET",
                  redirect: "follow",
                  signal: controller.signal,
                  headers: buildRequestHeaders(connector)
                });
                status = response.status;
                finalUrl = response.url || sourceUrl;
                contentType = response.headers.get("content-type") ?? undefined;
                const body = await response.arrayBuffer();
                responseBytes = body.byteLength;
                if (responseBytes > MAX_RESPONSE_BYTES) throw new Error(`Réponse trop volumineuse: ${responseBytes} octets`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                let html = new TextDecoder("utf-8").decode(body);
                if (connector.key === "ludisphere" && /application\/json/i.test(contentType ?? "")) { html = normalizeLudisphereShopifyJson(html); }
                validateSemanticResponse(html, connector);
                const extracted = extractCandidates(html, response.url || sourceUrl, connector, watchProducts);
                return {
                  sourceUrl,
                  finalUrl,
                  status,
                  contentType,
                  responseBytes,
                  durationMs: Math.round(performance.now() - started),
                  etag: response.headers.get("etag") ?? undefined,
                  lastModified: response.headers.get("last-modified") ?? undefined,
                  productLinksSeen: extracted.productLinksSeen,
                  candidates: extracted.candidates
                };
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                lastAudit = {
                  sourceUrl,
                  finalUrl,
                  status,
                  contentType,
                  responseBytes,
                  durationMs: Math.round(performance.now() - started),
                  productLinksSeen: 0,
                  candidates: [],
                  error: message
                };

                const retryableTransient = connector.key === "oupi" &&
                  attempt + 1 < attempts &&
                  (status === undefined || status === 429 || status >= 500);
                if (!retryableTransient) return lastAudit;
                await sleep(1_500);
              } finally {
                clearTimeout(timeout);
              }
            }

            return lastAudit ?? {
              sourceUrl,
              durationMs: Math.round(performance.now() - started),
              productLinksSeen: 0,
              candidates: [],
              error: "Échec de requête sans détail"
            };
          }
          '''
          p.write_text(s[:start]+replacement+s[end:])

          p=Path('cloudflare-worker/src/connectors/oupi.ts')
          s=p.read_text()
          s=s.replace(
            '"Un HTTP 403/429/5xx doit dégrader la source et ne doit jamais être interprété comme une rupture de stock."',
            '"Un 429/5xx ou une erreur réseau transitoire déclenche au maximum un second essai après 1,5 s ; un 403/challenge/CAPTCHA n’est jamais retenté ni contourné.",\n    "Si les deux essais échouent, la source reste dégradée et n’est jamais interprétée comme une rupture de stock."'
          )
          p.write_text(s)

          Path('cloudflare-worker/tests/oupi-transient-retry.test.ts').write_text(r'''import { afterEach, describe, expect, it, vi } from "vitest";
          import { auditConnector } from "../src/audit";
          import { oupi } from "../src/connectors/oupi";

          const connector = {
            ...oupi,
            sources: ["https://oupi.eu/fr/382-one-piece"],
            followDiscoveredProductPages: false
          };

          const okHtml = "<!doctype html><html><head><title>One Piece</title></head><body>One Piece Card Game</body></html>";

          afterEach(() => {
            vi.restoreAllMocks();
            vi.useRealTimers();
          });

          describe("Oupi transient retry", () => {
            it("réessaie une seule fois un HTTP 5xx puis accepte le succès", async () => {
              vi.useFakeTimers();
              const fetchMock = vi.spyOn(globalThis, "fetch")
                .mockResolvedValueOnce(new Response("temporaire", { status: 503 }))
                .mockResolvedValueOnce(new Response(okHtml, { status: 200, headers: { "content-type": "text/html" } }));
              const promise = auditConnector(connector);
              await vi.advanceTimersByTimeAsync(1_500);
              const audit = await promise;
              expect(fetchMock).toHaveBeenCalledTimes(2);
              expect(audit.sources[0].error).toBeUndefined();
              expect(audit.sources[0].status).toBe(200);
            });

            it("réessaie une seule fois une erreur réseau transitoire", async () => {
              vi.useFakeTimers();
              const fetchMock = vi.spyOn(globalThis, "fetch")
                .mockRejectedValueOnce(new TypeError("network reset"))
                .mockResolvedValueOnce(new Response(okHtml, { status: 200, headers: { "content-type": "text/html" } }));
              const promise = auditConnector(connector);
              await vi.advanceTimersByTimeAsync(1_500);
              const audit = await promise;
              expect(fetchMock).toHaveBeenCalledTimes(2);
              expect(audit.sources[0].status).toBe(200);
            });

            it("ne retente jamais un HTTP 403", async () => {
              const fetchMock = vi.spyOn(globalThis, "fetch")
                .mockResolvedValue(new Response("forbidden", { status: 403 }));
              const audit = await auditConnector(connector);
              expect(fetchMock).toHaveBeenCalledTimes(1);
              expect(audit.sources[0].status).toBe(403);
              expect(audit.sources[0].error).toBe("HTTP 403");
            });

            it("borne les 5xx à deux tentatives maximum", async () => {
              vi.useFakeTimers();
              const fetchMock = vi.spyOn(globalThis, "fetch")
                .mockImplementation(() => Promise.resolve(new Response("temporaire", { status: 503 })));
              const promise = auditConnector(connector);
              await vi.advanceTimersByTimeAsync(1_500);
              const audit = await promise;
              expect(fetchMock).toHaveBeenCalledTimes(2);
              expect(audit.sources[0].status).toBe(503);
              expect(audit.sources[0].error).toBe("HTTP 503");
            });
          });
          ''')
          PY
      - name: Validate branch
        working-directory: cloudflare-worker
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npx wrangler deploy --dry-run
      - name: Commit branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "op-watch-ci"
          git config user.email "op-watch-ci@users.noreply.github.com"
          git add cloudflare-worker/src/audit.ts cloudflare-worker/src/connectors/oupi.ts cloudflare-worker/tests/oupi-transient-retry.test.ts
          git diff --cached --check
          git commit -m "fix(oupi): retry one transient 429/5xx/network failure"
          git push origin HEAD:fix-oupi-transient-retry
