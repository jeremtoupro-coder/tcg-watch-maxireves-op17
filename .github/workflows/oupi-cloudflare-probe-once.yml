name: Oupi Cloudflare Probe One-Shot

on:
  push:
    branches: [fix-three-store-health]
    paths:
      - .github/workflows/oupi-cloudflare-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/fix-three-store-health" ]
          [ "${{ github.event.head_commit.message }}" = "test: probe Oupi RSS from Cloudflare once" ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and deploy ephemeral probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oupi-probe && cd /tmp/oupi-probe
          cat > worker.js <<'JS'
          export default {
            async fetch() {
              const urls = [
                'https://oupi.eu/fr/413-precommande-one-piece',
                'https://oupi.eu/fr/display-one-piece/7367-display-op-17-boite-de-booster-francais-one-piece-card-game.html',
                'https://oupi.eu/index.php?id_category=413&orderby=date_add&orderway=desc&fc=module&module=ps_feeder&controller=rss',
                'https://oupi.eu/module/ps_feeder/rss?id_category=413&orderby=date_add&orderway=desc',
                'https://oupi.eu/modules/feeder/rss.php?id_category=413&orderby=date_add&orderway=desc',
                'https://oupi.eu/en/382-one-piece?q=Language-French'
              ];
              const out = [];
              for (const url of urls) {
                const started = Date.now();
                try {
                  const res = await fetch(url, {headers:{
                    'User-Agent':'OPWatch/1.0 (+personal read-only stock monitor)',
                    'Accept':'text/html,application/xhtml+xml,application/rss+xml,application/xml;q=0.9,*/*;q=0.5',
                    'Accept-Language':'fr-FR,fr;q=0.9,en;q=0.6'
                  }});
                  const text = await res.text();
                  out.push({url,status:res.status,durationMs:Date.now()-started,server:res.headers.get('server'),contentType:res.headers.get('content-type'),retryAfter:res.headers.get('retry-after'),title:(text.match(/<title[^>]*>([^<]+)/i)?.[1]||text.match(/<title>([^<]+)/i)?.[1]||'').trim().slice(0,120),bodyPrefix:text.replace(/\s+/g,' ').slice(0,180)});
                } catch (e) {
                  out.push({url,status:'fetch-error',durationMs:Date.now()-started,error:String(e)});
                }
              }
              return Response.json(out, {headers:{'cache-control':'no-store'}});
            }
          };
          JS
          cat > wrangler.jsonc <<'JSON'
          {"name":"opwatch-oupi-probe","main":"worker.js","compatibility_date":"2026-08-01","workers_dev":true}
          JSON
          npx wrangler@4.120.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          sleep 12
          url="$(grep -Eo 'https://[^ ]+workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          curl -fsS --retry 4 --retry-delay 3 --max-time 180 "$url" | tee /tmp/oupi-result.json
          node -e "const x=require('/tmp/oupi-result.json'); if(!Array.isArray(x)||x.length!==6)process.exit(1)"
          npx wrangler@4.120.0 delete --config wrangler.jsonc --force || true
