name: OP Watch Cockpit Status One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-cockpit-status-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Force one real Philibert discovery
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"action":"runStoreNow","store":"philibert"}' \
            "https://op-watch-tcg-fr.pages.dev/cockpit/api/control" >/tmp/philibert.json
          status="$(curl -fsS --max-time 30 -H "Authorization: Bearer $token" "https://op-watch-tcg-fr.pages.dev/cockpit/api/status")"
          STATUS_JSON="$status" node - <<'NODE'
          const s=JSON.parse(process.env.STATUS_JSON||'{}'); const p=(s.stores||[]).find(x=>x.key==='philibert');
          console.log(JSON.stringify({totals:s.totals,philibert:p&&{level:p.level,label:p.label,runtimeStatus:p.runtimeStatus,candidates:p.candidates,lastCheck:p.lastCheck,detail:p.detail}},null,2));
          if(!p) process.exit(1);
          NODE
