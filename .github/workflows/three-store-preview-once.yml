name: Three Store Preview One-Shot

on:
  push:
    branches: [fix-three-store-health]
    paths:
      - .github/workflows/three-store-preview-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://tcg-watch-one-piece-preview.jeremie-touitou-pro.workers.dev
    steps:
      - name: Gate
        working-directory: .
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/fix-three-store-health" ]
          [ "${{ github.event.head_commit.message }}" = "test: recheck three stores after Oupi serialization" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - name: Derive preview audit token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Generate SAFE preview config
        run: npm run generate-deploy-config
        env:
          DEPLOY_WORKER_NAME: tcg-watch-one-piece-preview
          DEPLOY_BIND_KV: "false"
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "true"
      - name: Assert preview inert
        run: >-
          node -e "const c=require('./wrangler.generated.json'); if(c.name!=='tcg-watch-one-piece-preview'||c.vars.MONITORING_ENABLED!=='false'||c.vars.WRITE_STATE!=='false'||c.vars.DISCORD_MODE!=='dry-run'||c.vars.SCHEDULER_MODE!=='disabled'||c.triggers?.crons?.length||c.durable_objects||c.kv_namespaces?.length) process.exit(1)"
      - run: npx wrangler deploy --config wrangler.generated.json
      - run: printf '%s' "$PREVIEW_AUDIT_TOKEN" | npx wrangler secret put PREVIEW_AUDIT_TOKEN --config wrangler.generated.json
      - run: npm run stabilize-preview-auth
      - run: npm run smoke-preview
      - name: Audit 21 stores from Cloudflare
        run: npm run audit-preview
      - name: Print and require three-store health
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('audit-report.json','utf8'));
          const wanted=new Set(['oupi','philibert','otakuland']);
          const rows=(r.stores||[]).filter(x=>wanted.has(x.store)).map(x=>({store:x.store,runtimeStatus:x.runtimeStatus,productCount:x.productCount,frenchConfirmedProducts:x.frenchConfirmedProducts,commerciallyEligibleProducts:x.commerciallyEligibleProducts,latencyMs:x.latencyMs,errors:x.errors}));
          console.log(JSON.stringify(rows,null,2));
          if(rows.length!==3 || rows.some(x=>x.runtimeStatus!=='healthy')) process.exit(2);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-store-preview-${{ github.run_id }}
          path: cloudflare-worker/audit-report.json
          if-no-files-found: warn
          retention-days: 7
