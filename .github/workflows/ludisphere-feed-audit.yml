name: Ludisphere Feed Audit

on:
  push:
    branches: [cloudflare-workers-audit]

permissions:
  contents: read

jobs:
  deploy-feed:
    if: contains(github.event.head_commit.message, '[ludi-feed]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Generate feed worker config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('wrangler.ludisphere-feed.json', JSON.stringify({
            name: 'tcg-watch-ludisphere-feed',
            main: 'scripts/ludisphere-feed-worker.ts',
            compatibility_date: '2026-06-27',
            workers_dev: true
          }, null, 2));
          NODE
      - name: Deploy read-only feed worker
        run: npx wrangler deploy --config wrangler.ludisphere-feed.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate normalized feed semantics
        shell: bash
        run: |
          node <<'NODE'
          const url='https://tcg-watch-ludisphere-feed.jeremie-touitou-pro.workers.dev';
          let ok=false, last='';
          for(let i=0;i<12;i++) {
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(30000)});
              last=await r.text();
              console.log('HTTP',r.status,'bytes',last.length,'products',r.headers.get('x-opwatch-products'));
              if(r.ok && /One Piece/i.test(last) && /OP17/i.test(last) && /ludisphere\.fr\/products\//i.test(last)) {ok=true; break;}
            } catch(e) { console.log(String(e)); }
            await new Promise(res=>setTimeout(res,2500));
          }
          if(!ok) { console.error(last.slice(0,1000)); process.exit(1); }
          NODE
