name: Parkage Language Diagnostic

on:
  push:
    branches:
      - op-watch-v1-test
    paths:
      - .github/workflows/parkage-language-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Locate Parkage public catalog endpoint in frontend bundles
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          curl -fsSL --max-time 20 \
            -H 'User-Agent: OPWatch/1.0 (+personal read-only stock monitor)' \
            'https://www.parkage.com/fr/one-piece-card-game?language%5B%5D=fr' -o "$page"
          python3 - "$page" > /tmp/scripts.txt <<'PY'
          import re,sys,html
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          srcs=[]
          for m in re.finditer(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']',raw,re.I):
              src=html.unescape(m.group(1))
              if '/_next/' in src and src not in srcs: srcs.append(src)
          for src in srcs: print(src)
          PY
          echo "next_scripts=$(wc -l < /tmp/scripts.txt)"
          n=0
          while IFS= read -r src; do
            n=$((n+1)); [ "$n" -le 80 ] || break
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://www.parkage.com${src}" ;;
              *) url="https://www.parkage.com/${src}" ;;
            esac
            js="$(mktemp)"
            if ! curl -fsSL --max-time 15 -H 'User-Agent: OPWatch/1.0 (+personal read-only stock monitor)' "$url" -o "$js"; then rm -f "$js"; continue; fi
            if grep -Eqi 'strapiUrl|category_id|back\.parkage\.com|queryString|language.*category|products.*category' "$js"; then
              echo "===== BUNDLE $url ====="
              python3 - "$js" <<'PY'
          import re,sys
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          pats=[r'back\.parkage\.com',r'strapiUrl',r'category_id',r'queryString',r'/api/',r'products?',r'recherche']
          out=[]
          for pat in pats:
              for m in re.finditer(pat,raw,re.I):
                  s=raw[max(0,m.start()-700):min(len(raw),m.end()+1200)]
                  s=re.sub(r'\s+',' ',s)
                  if s not in out: out.append(s)
                  if len(out)>=15: break
              if len(out)>=15: break
          for i,s in enumerate(out): print(f'snippet[{i}]={s[:2200]}')
          PY
            fi
            rm -f "$js"
          done < /tmp/scripts.txt
          rm -f "$page" /tmp/scripts.txt
