name: Parkage Language Diagnostic

on:
  push:
    branches:
      - op-watch-v1-test
    paths:
      - .github/workflows/parkage-language-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode Parkage public search URL builder
        shell: bash
        run: |
          set -euo pipefail
          js="$(mktemp)"
          curl -fsSL --max-time 20 \
            -H 'User-Agent: OPWatch/1.0 (+personal read-only stock monitor)' \
            'https://www.parkage.com/_next/static/chunks/428-e973a7c8ca77e981.js' -o "$js"
          python3 - "$js" <<'PY'
          import re,sys
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          for needle in ['30625:function','function Un','Un:function','yX:function','/api/parkage/search']:
              print('====',needle,'====')
              for m in list(re.finditer(re.escape(needle),raw))[:10]:
                  print(raw[max(0,m.start()-500):min(len(raw),m.end()+6500)])
          PY
          rm -f "$js"
