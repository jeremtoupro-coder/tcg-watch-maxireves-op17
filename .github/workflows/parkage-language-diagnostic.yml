name: Parkage Language Diagnostic

on:
  push:
    branches:
      - op-watch-v1-test
    paths:
      - .github/workflows/parkage-language-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare anonymous Parkage catalog orderings
        shell: bash
        run: |
          set -euo pipefail
          for order in relevance id; do
            out="$(mktemp)"
            url="https://back.parkage.com/api/parkage/search/get?category_id=9883&complete=true&count=true&limit=20&offset=0&text=&preorder=&isnew=&lang=fr&with_quantity=false&isDiscount=false&order=${order}&direction=DESC"
            code="$(curl -sS -L --max-time 25 -o "$out" -w '%{http_code}' -H 'User-Agent: OPWatch/1.0 (+personal read-only stock monitor)' -H 'Accept: application/json' "$url")"
            echo "ORDER=${order} HTTP=${code}"
            [ "$code" = "200" ]
            python3 - "$out" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          items=obj.get('data',{}).get('list',[])
          for x in items[:12]: print(x.get('id'), x.get('lang'), x.get('name'))
          PY
            rm -f "$out"
          done
