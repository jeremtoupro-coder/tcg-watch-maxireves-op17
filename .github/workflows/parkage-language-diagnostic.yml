name: Parkage Language Diagnostic

on:
  push:
    branches:
      - op-watch-v1-test
    paths:
      - .github/workflows/parkage-language-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract French One Piece products from Parkage category payload
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.parkage.com/fr/one-piece-card-game?language%5B%5D=fr'
          file="$(mktemp)"
          curl -fsSL --max-time 20 \
            -H 'User-Agent: OPWatch/1.0 (+personal read-only stock monitor)' \
            -H 'Accept-Language: fr-FR,fr;q=0.9,en;q=0.6' \
            "$url" -o "$file"
          echo "bytes=$(wc -c < "$file")"
          python3 - "$file" <<'PY'
          import re, sys, html
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          # Next.js streams escaped JSON chunks. Decode common escapes enough to inspect product payloads.
          decoded=html.unescape(raw)
          decoded=decoded.replace('\\u0026','&').replace('\\u0027',"'").replace('\\u003c','<').replace('\\u003e','>')
          decoded=decoded.replace('\\"','"').replace('\\/','/')
          for ref in ['ST-31','ST-32','ST-33','ST-34','ST-35','ST-36','OP-17']:
              print(f'===== {ref} =====')
              matches=list(re.finditer(re.escape(ref), decoded, re.I))
              print('occurrences=',len(matches))
              seen=[]
              for m in matches[:30]:
                  s=decoded[max(0,m.start()-900):min(len(decoded),m.end()+1500)]
                  s=re.sub(r'\s+',' ',s)
                  # Keep snippets containing identifiers/title/language rather than whole page chrome.
                  if s not in seen:
                      seen.append(s)
              for i,s in enumerate(seen[:12]): print(f'snippet[{i}]={s[:2400]}')
          # Extract all Parkage product-looking URLs that carry tracked references.
          urls=[]
          for m in re.finditer(r'(?:https://www\.parkage\.com)?/fr/\d{6,}-[^"\\<> ]+', decoded, re.I):
              u=m.group(0).rstrip('),.;')
              if re.search(r'\b(?:OP|EB|PRB|ST|DP|TS)[-_ ]?\d{1,2}\b',u,re.I) and u not in urls:
                  urls.append(u)
          print('===== PRODUCT URLS =====')
          for u in urls[:100]: print(u)
          PY
          rm -f "$file"
