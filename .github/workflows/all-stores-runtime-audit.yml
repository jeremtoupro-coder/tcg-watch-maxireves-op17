name: All Stores Runtime Audit

on:
  push:
    branches:
      - cloudflare-workers-audit

permissions:
  contents: read

jobs:
  audit-21:
    if: contains(github.event.head_commit.message, '[audit-21]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Generate temporary SAFE audit config
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "true"
      - name: Deploy temporary SAFE audit preview
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Audit all 21 stores through actual Cloudflare runtime
        run: npx tsx scripts/audit-all-stores-runtime.ts
        env:
          PREVIEW_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      - name: Upload full runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-watch-runtime-audit-21
          path: cloudflare-worker/all-stores-runtime-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate locked SAFE preview config
        if: always()
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "false"
      - name: Restore locked SAFE preview
        if: always()
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
