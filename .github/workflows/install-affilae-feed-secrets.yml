name: OP Watch - Install Affilae Feed Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: op-watch-affilae-feed-secrets
  cancel-in-progress: false

jobs:
  install:
    name: Install three Affilae feeds securely
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTHORIZED_FEED_JOUECLUB_URL: ${{ secrets.AUTHORIZED_FEED_JOUECLUB_URL }}
      AUTHORIZED_FEED_LA_GRANDE_RECRE_URL: ${{ secrets.AUTHORIZED_FEED_LA_GRANDE_RECRE_URL }}
      AUTHORIZED_FEED_BCD_JEUX_URL: ${{ secrets.AUTHORIZED_FEED_BCD_JEUX_URL }}
    steps:
      - name: Main branch only
        working-directory: .
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Branche interdite::Installation des secrets uniquement depuis main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify credentials and feed secrets
        shell: bash
        run: |
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            AUTHORIZED_FEED_JOUECLUB_URL \
            AUTHORIZED_FEED_LA_GRANDE_RECRE_URL \
            AUTHORIZED_FEED_BCD_JEUX_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret manquant::$name n'est pas configuré."
              missing=1
            fi
          done
          exit "$missing"
      - name: Install feeds on production, preview and runtime-test
        shell: bash
        run: |
          for name in \
            AUTHORIZED_FEED_JOUECLUB_URL \
            AUTHORIZED_FEED_LA_GRANDE_RECRE_URL \
            AUTHORIZED_FEED_BCD_JEUX_URL; do
            value="${!name}"
            echo "::add-mask::$value"
            for worker in \
              tcg-watch-one-piece \
              tcg-watch-one-piece-preview \
              tcg-watch-one-piece-runtime-test; do
              printf '%s' "$value" | npx wrangler secret put "$name" --name "$worker"
            done
          done
      - name: Summary
        working-directory: .
        run: |
          echo "### Affilae product feeds installed" >> "$GITHUB_STEP_SUMMARY"
          echo "- JouéClub" >> "$GITHUB_STEP_SUMMARY"
          echo "- La Grande Récré" >> "$GITHUB_STEP_SUMMARY"
          echo "- BCD Jeux" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URLs remain encrypted secrets and are not printed." >> "$GITHUB_STEP_SUMMARY"
