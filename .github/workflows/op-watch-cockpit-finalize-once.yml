name: OP Watch Cockpit Finalize LIVE One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-cockpit-finalize-once.yml

permissions:
  contents: read

concurrency:
  group: op-watch-production-activation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PAGES_URL: https://op-watch-tcg-fr.pages.dev
    steps:
      - name: Hard gate
        working-directory: .
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "ops: finalize cockpit LIVE once" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Validate exact final code
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run
          grep -q 'connector.key === "amazon-fr"' src/cockpitApi.ts
          grep -q 'HEARTBEAT_PARIS_HOURS = new Set(\[10, 22\])' src/heartbeat.ts
      - name: Derive protected runtime token
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy final Worker LIVE
        run: |
          PRODUCTION_PHASE=live npm run generate-production-config
          node -e "const c=require('./wrangler.production-live.generated.json'); if(c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) process.exit(1)"
          npx wrangler deploy --config wrangler.production-live.generated.json
      - name: Deploy final neutral Pages cockpit
        run: |
          npx wrangler pages deploy public-site --project-name=op-watch-tcg-fr --branch=op-watch-v1-test --commit-hash="$GITHUB_SHA" --commit-message="OP Watch cockpit final LIVE"
      - name: Prove final cockpit end-to-end
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            html="$(curl -fsSL --max-time 20 "$PAGES_URL/cockpit/" || true)"
            anon="$(curl -sS -o /tmp/anon -w '%{http_code}' --max-time 15 "$PAGES_URL/cockpit/api/status" || true)"
            status="$(curl -sS --max-time 30 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PAGES_URL/cockpit/api/status" || true)"
            if HTML="$html" ANON="$anon" STATUS_JSON="$status" node - <<'NODE'
          try {
            const s=JSON.parse(process.env.STATUS_JSON||'{}');
            const stores=s.stores||[]; const amazon=stores.find(x=>x.key==='amazon-fr'); const pending=stores.filter(x=>x.configuredStatus==='pending_authorized_feed').length;
            const ok=(process.env.HTML||'').includes('OP Watch Cockpit')&&process.env.ANON==='401'&&s.runtime?.live===true&&s.runtime?.runtimeTest===false&&JSON.stringify(s.runtime?.heartbeatParis)===JSON.stringify(['10:00','22:00'])&&stores.length===21&&pending===6&&Number(s.totals?.green)>=8&&amazon?.level==='red';
            if(ok) console.log(JSON.stringify({runtime:s.runtime,totals:s.totals,pending,amazon:{level:amazon.level,label:amazon.label},philibert:stores.find(x=>x.key==='philibert')&&{level:stores.find(x=>x.key==='philibert').level,label:stores.find(x=>x.key==='philibert').label,detail:stores.find(x=>x.key==='philibert').detail}},null,2));
            process.exit(ok?0:1);
          } catch { process.exit(1); }
          NODE
            then echo "FINAL COCKPIT END-TO-END PASS"; break; fi
            if [ "$attempt" -eq 50 ]; then echo "$status"; exit 1; fi
            sleep 2
          done
      - name: Independently prove Cloudflare production state
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tcg-watch-one-piece"
          settings="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings")"
          schedules="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules")"
          SETTINGS_JSON="$settings" SCHEDULES_JSON="$schedules" node - <<'NODE'
          const s=JSON.parse(process.env.SETTINGS_JSON),c=JSON.parse(process.env.SCHEDULES_JSON),b=s.result?.bindings||[],vars={}; for(const x of b) if(x.type==='plain_text') vars[x.name]=x.text??x.value; const rows=Array.isArray(c.result)?c.result:(c.result?.schedules||[]),crons=rows.map(x=>x.cron).filter(Boolean),names=new Set(b.map(x=>x.name)); const ok=vars.MONITORING_ENABLED==='true'&&vars.WRITE_STATE==='true'&&vars.DISCORD_MODE==='live'&&vars.SCHEDULER_MODE==='live'&&vars.RUNTIME_TEST_MODE==='false'&&crons.includes('* * * * *')&&names.has('DISCORD_WEBHOOK_URL')&&names.has('STORE_MONITORS')&&names.has('CALENDAR_COORDINATOR'); console.log(JSON.stringify({monitoring:vars.MONITORING_ENABLED,write:vars.WRITE_STATE,discord:vars.DISCORD_MODE,scheduler:vars.SCHEDULER_MODE,runtimeTest:vars.RUNTIME_TEST_MODE,crons},null,2)); process.exit(ok?0:1);
          NODE
