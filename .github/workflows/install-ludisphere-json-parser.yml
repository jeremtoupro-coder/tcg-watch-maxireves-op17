name: Install Ludisphere JSON Parser

on:
  push:
    branches: [cloudflare-workers-audit]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[install-ludi-json]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Patch generic audit parser
        run: node scripts/patch-ludisphere-json.cjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Commit validated parser
        shell: bash
        run: |
          if git diff --quiet -- src/audit.ts; then
            echo "No parser change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audit.ts
          git commit -m "fix(ludisphere): parse public Shopify collection JSON"
          git push origin HEAD:cloudflare-workers-audit
