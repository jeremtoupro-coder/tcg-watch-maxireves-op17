name: Philibert Exact RSS Probe One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/philibert-exact-rss-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Hard gate
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "test: probe exact Philibert One Piece RSS variants once" ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy ephemeral probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/philibert-exact && cd /tmp/philibert-exact
          cat > worker.js <<'JS'
          const rss='https://www.philibertnet.com/modules/feeder/rss.php?id_category=15860';
          const product='https://www.philibertnet.com/fr/one-piece-le-jeu-de-cartes/179736-one-piece-le-jeu-de-cartes-op17-les-guerriers-les-plus-puissants-au-monde-booster-double-pack-2100001380267.html';
          const variants=[
            {name:'current',headers:{'User-Agent':'OPWatch/1.0 (+personal read-only stock monitor)','Accept':'text/html,application/xhtml+xml;q=0.9,*/*;q=0.5','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.6'}},
            {name:'rss-accept',headers:{'User-Agent':'OPWatch/1.0 (+personal read-only stock monitor)','Accept':'application/rss+xml,application/xml,text/xml,text/html;q=0.8,*/*;q=0.4','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.6'}},
            {name:'minimal',headers:{'User-Agent':'OPWatch/1.0 (+personal read-only stock monitor)','Accept':'*/*'}},
            {name:'default',headers:{}}
          ];
          async function hit(url,variant){
            const started=Date.now();
            try{
              const r=await fetch(url,{redirect:'follow',headers:variant.headers});
              const t=await r.text();
              return {variant:variant.name,url,status:r.status,ms:Date.now()-started,contentType:r.headers.get('content-type'),bytes:new TextEncoder().encode(t).byteLength,hasOnePiece:/one[\s-]*piece/i.test(t),hasOP17:/OP[-\s]?17/i.test(t),items:(t.match(/<item\b/gi)||[]).length,prefix:t.replace(/\s+/g,' ').slice(0,160)};
            }catch(e){return {variant:variant.name,url,status:'fetch-error',ms:Date.now()-started,error:String(e)}}
          }
          export default {async fetch(){
            const out=[];
            for(const variant of variants){out.push(await hit(rss,variant));}
            for(const variant of variants){out.push(await hit(product,variant));}
            return Response.json(out,{headers:{'cache-control':'no-store'}});
          }};
          JS
          cat > wrangler.jsonc <<'JSON'
          {"name":"opwatch-philibert-exact-probe","main":"worker.js","compatibility_date":"2026-08-01","workers_dev":true}
          JSON
          npx wrangler@4.120.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          sleep 10
          url="$(grep -Eo 'https://[^ ]+workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          curl -fsS --retry 3 --retry-delay 2 --max-time 180 "$url" > /tmp/result.json
          node - <<'NODE'
          const x=require('/tmp/result.json');
          console.log(JSON.stringify(x,null,2));
          if(!Array.isArray(x)||x.length!==8) process.exit(1);
          NODE
          npx wrangler@4.120.0 delete --config wrangler.jsonc --force || true
