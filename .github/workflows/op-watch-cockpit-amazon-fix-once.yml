name: OP Watch Cockpit Amazon Status Fix One-Shot

on:
  push:
    branches: [op-watch-cockpit-status-fix]
    paths:
      - .github/workflows/op-watch-cockpit-amazon-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: op-watch-cockpit-status-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Fix Amazon FR key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/src/cockpitApi.ts')
          t=p.read_text()
          old='connector.key === "amazon" && health.candidates === 0'
          new='connector.key === "amazon-fr" && health.candidates === 0'
          if t.count(old)!=1: raise SystemExit(f'expected one Amazon status rule, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Validate
        working-directory: cloudflare-worker
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run
          grep -q 'connector.key === "amazon-fr"' src/cockpitApi.ts
      - name: Commit fix
        run: |
          git config user.name "op-watch-cockpit-bot"
          git config user.email "op-watch-cockpit-bot@users.noreply.github.com"
          git add cloudflare-worker/src/cockpitApi.ts
          git commit -m "fix: classify Amazon FR unavailable as red"
          git push origin HEAD:op-watch-cockpit-status-fix
