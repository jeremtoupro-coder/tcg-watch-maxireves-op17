name: OP Watch LIVE Health Fix One-Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-live-hotfix-once.yml

permissions:
  contents: read

concurrency:
  group: op-watch-production-activation
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy and independently verify LIVE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard one-shot gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$GITHUB_EVENT_NAME" = "push" ]
          [ "${{ github.event.head_commit.message }}" = "ops: deploy health status fix LIVE" ]

      - name: Checkout exact production revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Assert production fixes are present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'authoritativeStructuredFeed: true' src/connectors/parkage.ts
          grep -q 'Vendeur non confirmé (Marketplace E.Leclerc)' src/discord.ts
          grep -q 'stateBackend' src/index.ts
          grep -q 'durable_objects' src/index.ts
          if grep -q 'requiredSellerPatterns' src/connectors/leclerc.ts; then
            echo 'Leclerc seller gate is still present'
            exit 1
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Worker build dry run
        run: npx wrangler deploy --dry-run

      - name: Verify production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_WEBHOOK_URL; do
            [ -n "${!name}" ] || { echo "Missing $name"; exit 1; }
          done

      - name: Derive private readiness token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Generate standby production config
        run: npm run generate-production-config
        env:
          PRODUCTION_PHASE: standby

      - name: Assert standby is inert and not test
        run: >-
          node -e "const c=require('./wrangler.production-standby.generated.json'); const b=c.durable_objects?.bindings||[];
          if(c.name!=='tcg-watch-one-piece'||c.vars.MONITORING_ENABLED!=='false'||c.vars.WRITE_STATE!=='false'||
          c.vars.DISCORD_MODE!=='dry-run'||c.vars.SCHEDULER_MODE!=='disabled'||c.vars.RUNTIME_TEST_MODE!=='false'||
          c.kv_namespaces?.length||c.triggers?.crons?.length||b.length!==2) process.exit(1)"

      - name: Deploy inert standby
        run: npx wrangler deploy --config wrangler.production-standby.generated.json

      - name: Install private readiness token
        run: printf '%s' "$PREVIEW_AUDIT_TOKEN" | npx wrangler secret put PREVIEW_AUDIT_TOKEN --config wrangler.production-standby.generated.json

      - name: Install Discord webhook secret while standby is inert
        run: printf '%s' "$DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL --config wrangler.production-standby.generated.json

      - name: Install configured authorized feed secrets
        shell: bash
        env:
          AUTHORIZED_FEED_PLAYIN_URL: ${{ secrets.AUTHORIZED_FEED_PLAYIN_URL }}
          AUTHORIZED_FEED_CULTURA_URL: ${{ secrets.AUTHORIZED_FEED_CULTURA_URL }}
          AUTHORIZED_FEED_MICROMANIA_URL: ${{ secrets.AUTHORIZED_FEED_MICROMANIA_URL }}
          AUTHORIZED_FEED_FNAC_URL: ${{ secrets.AUTHORIZED_FEED_FNAC_URL }}
          AUTHORIZED_FEED_CARREFOUR_URL: ${{ secrets.AUTHORIZED_FEED_CARREFOUR_URL }}
          AUTHORIZED_FEED_KING_JOUET_URL: ${{ secrets.AUTHORIZED_FEED_KING_JOUET_URL }}
        run: |
          set -euo pipefail
          for name in AUTHORIZED_FEED_PLAYIN_URL AUTHORIZED_FEED_CULTURA_URL AUTHORIZED_FEED_MICROMANIA_URL AUTHORIZED_FEED_FNAC_URL AUTHORIZED_FEED_CARREFOUR_URL AUTHORIZED_FEED_KING_JOUET_URL; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.production-standby.generated.json
            fi
          done

      - name: Smoke standby
        run: npm run smoke-production
        env:
          PRODUCTION_SMOKE_PHASE: standby

      - name: Generate armed LIVE config without cron
        run: npm run generate-production-config
        env:
          PRODUCTION_PHASE: armed

      - name: Assert armed LIVE has no cron and is not test
        run: >-
          node -e "const c=require('./wrangler.production-armed.generated.json');
          if(c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||
          c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||c.kv_namespaces?.length||c.triggers?.crons?.length) process.exit(1)"

      - name: Deploy armed LIVE without cron
        run: npx wrangler deploy --config wrangler.production-armed.generated.json

      - name: Smoke armed LIVE readiness
        run: npm run smoke-production
        env:
          PRODUCTION_SMOKE_PHASE: armed

      - name: Generate final one-minute LIVE config
        run: npm run generate-production-config
        env:
          PRODUCTION_PHASE: live

      - name: Assert final LIVE gates
        run: >-
          node -e "const c=require('./wrangler.production-live.generated.json');
          if(c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||
          c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||c.kv_namespaces?.length||
          JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) process.exit(1)"

      - name: Activate final LIVE cron
        run: npx wrangler deploy --config wrangler.production-live.generated.json

      - name: Final LIVE readiness smoke
        run: npm run smoke-production
        env:
          PRODUCTION_SMOKE_PHASE: live

      - name: Verify public health reflects actual Durable Objects LIVE runtime
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$PRODUCTION_URL/health")"
          HEALTH_JSON="$health" node - <<'NODE'
          const h=JSON.parse(process.env.HEALTH_JSON);
          const parkage=h.stores?.find(s=>s.store==='parkage');
          const leclerc=h.stores?.find(s=>s.store==='leclerc');
          const proof={
            status:h.status, mode:h.mode, monitoringEnabled:h.monitoringEnabled,
            discordMode:h.discordMode, schedulerMode:h.schedulerMode,
            runtimeTestMode:h.runtimeTestMode, stateBindingPresent:h.stateBindingPresent,
            stateBackend:h.stateBackend, automaticPolling:h.automaticPolling,
            parkage:parkage&&{status:parkage.status,sourceKind:parkage.sourceKind},
            leclerc:leclerc&&{status:leclerc.status,sourceKind:leclerc.sourceKind}
          };
          console.log(JSON.stringify(proof,null,2));
          if(h.status!=='ok'||h.mode!=='LIVE'||h.monitoringEnabled!==true||h.discordMode!=='live'||
             h.schedulerMode!=='live'||h.runtimeTestMode!==false||h.stateBindingPresent!==true||
             h.stateBackend!=='durable_objects'||h.automaticPolling!==true) process.exit(1);
          if(!parkage||parkage.status!=='active_fast_watch'||parkage.sourceKind!=='public_structured_feed') process.exit(1);
          if(!leclerc||leclerc.status!=='active_fast_watch') process.exit(1);
          NODE

      - name: Independently verify Cloudflare bindings and one-minute cron
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          settings="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings")"
          schedules="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules")"
          SETTINGS_JSON="$settings" SCHEDULES_JSON="$schedules" node - <<'NODE'
          const s=JSON.parse(process.env.SETTINGS_JSON); const c=JSON.parse(process.env.SCHEDULES_JSON);
          if(s.success!==true||c.success!==true) process.exit(1);
          const bindings=Array.isArray(s.result?.bindings)?s.result.bindings:[];
          const safeVars={};
          const wanted=new Set(['MONITORING_ENABLED','WRITE_STATE','DISCORD_MODE','SCHEDULER_MODE','RUNTIME_TEST_MODE','PRODUCTION_PROBE_MODE']);
          for(const b of bindings){
            if(wanted.has(b.name) && b.type==='plain_text') safeVars[b.name]=b.text ?? b.value;
          }
          const names=new Set(bindings.map(b=>b.name));
          const crons=(Array.isArray(c.result)?c.result:[]).map(x=>x.cron).filter(Boolean).sort();
          const proof={vars:safeVars,crons,discordSecretPresent:names.has('DISCORD_WEBHOOK_URL'),durableObjects:{store:names.has('STORE_MONITORS'),calendar:names.has('CALENDAR_COORDINATOR')}};
          console.log(JSON.stringify(proof,null,2));
          if(safeVars.MONITORING_ENABLED!=='true'||safeVars.WRITE_STATE!=='true'||safeVars.DISCORD_MODE!=='live'||
             safeVars.SCHEDULER_MODE!=='live'||safeVars.RUNTIME_TEST_MODE!=='false'||safeVars.PRODUCTION_PROBE_MODE!=='true') process.exit(1);
          if(JSON.stringify(crons)!==JSON.stringify(['* * * * *'])) process.exit(1);
          if(!names.has('DISCORD_WEBHOOK_URL')||!names.has('STORE_MONITORS')||!names.has('CALENDAR_COORDINATOR')) process.exit(1);
          NODE
