name: OP Watch Final LIVE Proof One-Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-live-hotfix-once.yml

permissions:
  contents: read

concurrency:
  group: op-watch-production-activation
  cancel-in-progress: false

jobs:
  verify:
    name: Reassert final config and prove Cloudflare LIVE
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard final gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$GITHUB_EVENT_NAME" = "push" ]
          [ "${{ github.event.head_commit.message }}" = "ops: reassert verified LIVE cron final" ]

      - name: Checkout exact production revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies and validate exact code
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          grep -q 'authoritativeStructuredFeed: true' src/connectors/parkage.ts
          grep -q 'Vendeur non confirmé (Marketplace E.Leclerc)' src/discord.ts
          grep -q 'durable_objects' src/index.ts
          if grep -q 'requiredSellerPatterns' src/connectors/leclerc.ts; then exit 1; fi

      - name: Verify credentials and derive readiness token
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_WEBHOOK_URL; do [ -n "${!name}" ] || exit 1; done
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Generate and assert final LIVE config
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_PHASE=live npm run generate-production-config
          node -e "const c=require('./wrangler.production-live.generated.json'); const b=c.durable_objects?.bindings||[]; if(c.name!=='tcg-watch-one-piece'||c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||c.vars.PRODUCTION_PROBE_MODE!=='true'||c.kv_namespaces?.length||b.length!==2||JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) process.exit(1)"

      - name: Reassert final Worker and cron as the last production mutation
        run: npx wrangler deploy --config wrangler.production-live.generated.json

      - name: Wait for real runtime LIVE propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            raw="$(curl -sS --max-time 15 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready?probe=$attempt" || true)"
            if READY_JSON="$raw" node - <<'NODE'
          try { const x=JSON.parse(process.env.READY_JSON||'{}'); process.exit(x.status==='ready'&&x.mode==='live'&&x.schedulerMode==='live'&&x.discordMode==='live'&&x.monitoringEnabled===true&&x.stateWritesEnabled===true&&Array.isArray(x.stores)&&x.stores.length===21?0:1); } catch { process.exit(1); }
          NODE
            then echo "runtime-ready LIVE PASS"; break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done

      - name: Prove public health and Parkage Leclerc state
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$PRODUCTION_URL/health?final=1")"
          HEALTH_JSON="$health" node - <<'NODE'
          const h=JSON.parse(process.env.HEALTH_JSON); const p=h.stores?.find(s=>s.store==='parkage'); const l=h.stores?.find(s=>s.store==='leclerc');
          const proof={mode:h.mode,monitoring:h.monitoringEnabled,discord:h.discordMode,scheduler:h.schedulerMode,runtimeTest:h.runtimeTestMode,stateBackend:h.stateBackend,automaticPolling:h.automaticPolling,parkage:p&&{status:p.status,sourceKind:p.sourceKind},leclerc:l&&{status:l.status,sourceKind:l.sourceKind}};
          console.log(JSON.stringify(proof,null,2));
          const ok=h.status==='ok'&&h.mode==='LIVE'&&h.monitoringEnabled===true&&h.discordMode==='live'&&h.schedulerMode==='live'&&h.runtimeTestMode===false&&h.stateBindingPresent===true&&h.stateBackend==='durable_objects'&&h.automaticPolling===true&&p?.status==='active_fast_watch'&&p?.sourceKind==='public_structured_feed'&&l?.status==='active_fast_watch';
          process.exit(ok?0:1);
          NODE

      - name: Independently prove actual Cloudflare bindings and cron
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          for attempt in $(seq 1 20); do
            settings="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings")"
            schedules="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules")"
            if SETTINGS_JSON="$settings" SCHEDULES_JSON="$schedules" node - <<'NODE'
          const s=JSON.parse(process.env.SETTINGS_JSON), c=JSON.parse(process.env.SCHEDULES_JSON);
          if(s.success!==true||c.success!==true) process.exit(1);
          const bindings=Array.isArray(s.result?.bindings)?s.result.bindings:[];
          const wanted=new Set(['MONITORING_ENABLED','WRITE_STATE','DISCORD_MODE','SCHEDULER_MODE','RUNTIME_TEST_MODE','PRODUCTION_PROBE_MODE']);
          const vars={}; for(const b of bindings) if(wanted.has(b.name)&&b.type==='plain_text') vars[b.name]=b.text??b.value;
          const names=new Set(bindings.map(b=>b.name));
          const scheduleRows=Array.isArray(c.result)?c.result:(Array.isArray(c.result?.schedules)?c.result.schedules:[]);
          const crons=scheduleRows.map(x=>x.cron).filter(Boolean).sort();
          const proof={vars,crons,discordSecretPresent:names.has('DISCORD_WEBHOOK_URL'),storeDO:names.has('STORE_MONITORS'),calendarDO:names.has('CALENDAR_COORDINATOR')};
          const ok=vars.MONITORING_ENABLED==='true'&&vars.WRITE_STATE==='true'&&vars.DISCORD_MODE==='live'&&vars.SCHEDULER_MODE==='live'&&vars.RUNTIME_TEST_MODE==='false'&&vars.PRODUCTION_PROBE_MODE==='true'&&JSON.stringify(crons)===JSON.stringify(['* * * * *'])&&proof.discordSecretPresent&&proof.storeDO&&proof.calendarDO;
          if(ok) console.log(JSON.stringify(proof,null,2)); process.exit(ok?0:1);
          NODE
            then echo "Cloudflare API LIVE PASS attempt=$attempt"; exit 0; fi
            sleep 2
          done
          echo "Cloudflare API did not converge to expected LIVE state"
          exit 1
