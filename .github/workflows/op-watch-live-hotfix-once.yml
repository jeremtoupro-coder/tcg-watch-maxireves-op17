name: OP Watch Restore Final LIVE One-Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-live-hotfix-once.yml

permissions:
  contents: read

concurrency:
  group: op-watch-production-activation
  cancel-in-progress: false

jobs:
  deploy:
    name: Restore and independently prove final LIVE
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard one-shot gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$GITHUB_EVENT_NAME" = "push" ]
          [ "${{ github.event.head_commit.message }}" = "ops: restore final LIVE after health propagation" ]

      - name: Checkout exact production revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Assert exact hotfix and health code
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'authoritativeStructuredFeed: true' src/connectors/parkage.ts
          grep -q 'Vendeur non confirmé (Marketplace E.Leclerc)' src/discord.ts
          grep -q 'stateBackend' src/index.ts
          grep -q 'durable_objects' src/index.ts
          if grep -q 'requiredSellerPatterns' src/connectors/leclerc.ts; then exit 1; fi

      - name: TypeScript check and tests
        run: npm run typecheck && npm test

      - name: Verify required production secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_WEBHOOK_URL; do
            [ -n "${!name}" ] || { echo "Missing $name"; exit 1; }
          done

      - name: Derive private readiness token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Generate final LIVE config
        run: npm run generate-production-config
        env:
          PRODUCTION_PHASE: live

      - name: Assert final LIVE gates before deployment
        run: >-
          node -e "const c=require('./wrangler.production-live.generated.json'); const b=c.durable_objects?.bindings||[];
          if(c.name!=='tcg-watch-one-piece'||c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||
          c.vars.DISCORD_MODE!=='live'||c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||
          c.kv_namespaces?.length||b.length!==2||JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) process.exit(1)"

      - name: Deploy final LIVE Worker and one-minute cron
        run: npx wrangler deploy --config wrangler.production-live.generated.json

      - name: Reinstall private readiness and Discord secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_AUDIT_TOKEN" | npx wrangler secret put PREVIEW_AUDIT_TOKEN --config wrangler.production-live.generated.json
          printf '%s' "$DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL --config wrangler.production-live.generated.json

      - name: Reinstall any configured authorized feed secrets
        shell: bash
        env:
          AUTHORIZED_FEED_PLAYIN_URL: ${{ secrets.AUTHORIZED_FEED_PLAYIN_URL }}
          AUTHORIZED_FEED_CULTURA_URL: ${{ secrets.AUTHORIZED_FEED_CULTURA_URL }}
          AUTHORIZED_FEED_MICROMANIA_URL: ${{ secrets.AUTHORIZED_FEED_MICROMANIA_URL }}
          AUTHORIZED_FEED_FNAC_URL: ${{ secrets.AUTHORIZED_FEED_FNAC_URL }}
          AUTHORIZED_FEED_CARREFOUR_URL: ${{ secrets.AUTHORIZED_FEED_CARREFOUR_URL }}
          AUTHORIZED_FEED_KING_JOUET_URL: ${{ secrets.AUTHORIZED_FEED_KING_JOUET_URL }}
        run: |
          set -euo pipefail
          for name in AUTHORIZED_FEED_PLAYIN_URL AUTHORIZED_FEED_CULTURA_URL AUTHORIZED_FEED_MICROMANIA_URL AUTHORIZED_FEED_FNAC_URL AUTHORIZED_FEED_CARREFOUR_URL AUTHORIZED_FEED_KING_JOUET_URL; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.production-live.generated.json
            fi
          done

      - name: Wait until runtime readiness is actually propagated
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            raw="$(curl -sS --max-time 15 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready?probe=$attempt" || true)"
            if READY_JSON="$raw" node - <<'NODE'
          try {
            const x=JSON.parse(process.env.READY_JSON||'{}');
            process.exit(x.status==='ready'&&x.mode==='live'&&x.schedulerMode==='live'&&x.discordMode==='live'&&x.monitoringEnabled===true&&x.stateWritesEnabled===true&&Array.isArray(x.stores)&&x.stores.length===21 ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then echo "runtime-ready PASS attempt=$attempt"; break; fi
            if [ "$attempt" -eq 30 ]; then echo "runtime-ready never reached LIVE"; exit 1; fi
            sleep 2
          done

      - name: Verify public health after propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health="$(curl -sS --max-time 15 "$PRODUCTION_URL/health?probe=$attempt" || true)"
            if HEALTH_JSON="$health" node - <<'NODE'
          try {
            const h=JSON.parse(process.env.HEALTH_JSON||'{}');
            const p=h.stores?.find(s=>s.store==='parkage');
            const l=h.stores?.find(s=>s.store==='leclerc');
            const ok=h.status==='ok'&&h.mode==='LIVE'&&h.monitoringEnabled===true&&h.discordMode==='live'&&
              h.schedulerMode==='live'&&h.runtimeTestMode===false&&h.stateBindingPresent===true&&
              h.stateBackend==='durable_objects'&&h.automaticPolling===true&&
              p?.status==='active_fast_watch'&&p?.sourceKind==='public_structured_feed'&&l?.status==='active_fast_watch';
            if(ok) console.log(JSON.stringify({mode:h.mode,monitoring:h.monitoringEnabled,discord:h.discordMode,scheduler:h.schedulerMode,runtimeTest:h.runtimeTestMode,stateBackend:h.stateBackend,automaticPolling:h.automaticPolling,parkage:{status:p.status,sourceKind:p.sourceKind},leclerc:{status:l.status,sourceKind:l.sourceKind}},null,2));
            process.exit(ok?0:1);
          } catch { process.exit(1); }
          NODE
            then break; fi
            if [ "$attempt" -eq 30 ]; then echo "health never reflected LIVE"; exit 1; fi
            sleep 2
          done

      - name: Independently prove Cloudflare bindings and cron
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          settings="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings")"
          schedules="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules")"
          SETTINGS_JSON="$settings" SCHEDULES_JSON="$schedules" node - <<'NODE'
          const s=JSON.parse(process.env.SETTINGS_JSON); const c=JSON.parse(process.env.SCHEDULES_JSON);
          if(s.success!==true||c.success!==true) process.exit(1);
          const bindings=Array.isArray(s.result?.bindings)?s.result.bindings:[];
          const wanted=new Set(['MONITORING_ENABLED','WRITE_STATE','DISCORD_MODE','SCHEDULER_MODE','RUNTIME_TEST_MODE','PRODUCTION_PROBE_MODE']);
          const vars={}; for(const b of bindings) if(wanted.has(b.name)&&b.type==='plain_text') vars[b.name]=b.text??b.value;
          const names=new Set(bindings.map(b=>b.name));
          const crons=(Array.isArray(c.result)?c.result:[]).map(x=>x.cron).filter(Boolean).sort();
          const proof={vars,crons,discordSecretPresent:names.has('DISCORD_WEBHOOK_URL'),storeDO:names.has('STORE_MONITORS'),calendarDO:names.has('CALENDAR_COORDINATOR')};
          console.log(JSON.stringify(proof,null,2));
          const ok=vars.MONITORING_ENABLED==='true'&&vars.WRITE_STATE==='true'&&vars.DISCORD_MODE==='live'&&vars.SCHEDULER_MODE==='live'&&vars.RUNTIME_TEST_MODE==='false'&&vars.PRODUCTION_PROBE_MODE==='true'&&JSON.stringify(crons)===JSON.stringify(['* * * * *'])&&proof.discordSecretPresent&&proof.storeDO&&proof.calendarDO;
          process.exit(ok?0:1);
          NODE
