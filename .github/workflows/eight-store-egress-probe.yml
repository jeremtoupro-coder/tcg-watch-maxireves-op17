name: Eight Store Egress Probe

on:
  push:
    branches:
      - cloudflare-workers-audit

permissions:
  contents: read

jobs:
  probe-eight:
    if: contains(github.event.head_commit.message, '[probe-gh-8]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe degraded stores from GitHub runner
        run: npx tsx scripts/probe-eight-github-runner.ts
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-store-github-egress
          path: cloudflare-worker/eight-store-github-egress.json
          retention-days: 7
