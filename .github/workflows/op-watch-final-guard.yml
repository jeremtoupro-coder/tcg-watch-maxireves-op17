name: OP Watch Final Production Guard (one-off)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-final-guard.yml

permissions:
  contents: read
  actions: write

jobs:
  final-guard:
    name: Cancel stale activation and verify final LIVE state
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REPO: ${{ github.repository }}
      PRODUCTION_WORKFLOW_ID: "293939743"
      LEGACY_WORKFLOW_ID: "303112857"
      STALE_RUN_ID: "31401567016"
      WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Checkout final repository state
        uses: actions/checkout@v4
      - name: Assert production workflow is manual-only in repository
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/watch-maxireves.yml
          grep -q 'workflow_dispatch:' "$file"
          if grep -q '^  push:' "$file"; then
            echo 'Production workflow still contains a push trigger' >&2
            exit 1
          fi
      - name: Force-cancel stale activation and verify workflow states
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          stale="$(curl -fsS "${auth[@]}" "${api}/actions/runs/${STALE_RUN_ID}")"
          status="$(RUN_JSON="$stale" node -e "const j=JSON.parse(process.env.RUN_JSON); process.stdout.write(j.status || '')")"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ]; then
            normal_code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${STALE_RUN_ID}/cancel")"
            if [ "$normal_code" -lt 200 ] || [ "$normal_code" -ge 300 ]; then
              force_code="$(curl -sS -o /tmp/force-cancel.json -w '%{http_code}' -X POST "${auth[@]}" "${api}/actions/runs/${STALE_RUN_ID}/force-cancel")"
              if [ "$force_code" -lt 200 ] || [ "$force_code" -ge 300 ]; then
                echo "Unable to cancel stale run: normal=${normal_code}, force=${force_code}" >&2
                cat /tmp/force-cancel.json >&2 || true
                exit 1
              fi
            fi
          fi

          for i in 1 2 3 4 5; do
            stale="$(curl -fsS "${auth[@]}" "${api}/actions/runs/${STALE_RUN_ID}")"
            status="$(RUN_JSON="$stale" node -e "const j=JSON.parse(process.env.RUN_JSON); process.stdout.write(j.status || '')")"
            [ "$status" = "completed" ] && break
            sleep 2
          done
          if [ "$status" != "completed" ]; then
            echo "Stale run still not completed after cancellation: ${status}" >&2
            exit 1
          fi

          prod="$(curl -fsS "${auth[@]}" "${api}/actions/workflows/${PRODUCTION_WORKFLOW_ID}")"
          legacy="$(curl -fsS "${auth[@]}" "${api}/actions/workflows/${LEGACY_WORKFLOW_ID}")"
          PROD_JSON="$prod" LEGACY_JSON="$legacy" STALE_JSON="$stale" node <<'NODE'
          const prod = JSON.parse(process.env.PROD_JSON);
          const legacy = JSON.parse(process.env.LEGACY_JSON);
          const stale = JSON.parse(process.env.STALE_JSON);
          if (prod.state !== 'active') throw new Error(`Production workflow not active: ${prod.state}`);
          if (legacy.state !== 'disabled_manually') throw new Error(`Legacy workflow unexpectedly enabled: ${legacy.state}`);
          if (stale.status !== 'completed' || !['cancelled','failure','skipped'].includes(stale.conclusion)) {
            throw new Error(`Stale run not safely terminated: ${stale.status}/${stale.conclusion}`);
          }
          console.log(JSON.stringify({productionWorkflow:prod.state, legacyWorkflow:legacy.state, staleRun:`${stale.status}/${stale.conclusion}`}));
          NODE
      - name: Verify actual Cloudflare LIVE settings after repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          settings="$(curl -fsS "${auth[@]}" "${base}/settings")"
          schedules="$(curl -fsS "${auth[@]}" "${base}/schedules")"
          secrets="$(curl -fsS "${auth[@]}" "${base}/secrets")"
          SETTINGS="$settings" SCHEDULES="$schedules" SECRETS="$secrets" node <<'NODE'
          const settings = JSON.parse(process.env.SETTINGS);
          const schedules = JSON.parse(process.env.SCHEDULES);
          const secrets = JSON.parse(process.env.SECRETS);
          for (const [name, response] of Object.entries({settings,schedules,secrets})) {
            if (response.success !== true) throw new Error(`${name} API failed`);
          }
          const bindings = settings.result?.bindings ?? [];
          const byName = new Map(bindings.map(b => [b.name, b]));
          const val = n => byName.get(n)?.text ?? byName.get(n)?.value ?? byName.get(n)?.json;
          const expected = {
            MONITORING_ENABLED:'true', WRITE_STATE:'true', DISCORD_MODE:'live',
            SCHEDULER_MODE:'live', RUNTIME_TEST_MODE:'false', PRODUCTION_PROBE_MODE:'true'
          };
          for (const [k,v] of Object.entries(expected)) if (String(val(k)) !== v) throw new Error(`${k}=${String(val(k))}`);
          if (!byName.has('STORE_MONITORS') || !byName.has('CALENDAR_COORDINATOR')) throw new Error('Durable Objects missing');
          if (bindings.some(b => /kv/i.test(String(b.type)))) throw new Error('Unexpected KV binding');
          const list = Array.isArray(schedules.result) ? schedules.result : (schedules.result?.schedules ?? []);
          if (list.length !== 1 || list[0]?.cron !== '* * * * *') throw new Error(`Unexpected schedules ${JSON.stringify(list)}`);
          const secretList = Array.isArray(secrets.result) ? secrets.result : (secrets.result?.secrets ?? []);
          const names = new Set(secretList.map(s => s.name));
          if (!names.has('DISCORD_WEBHOOK_URL')) throw new Error('Discord secret missing');
          console.log(JSON.stringify({ok:true, monitoring:val('MONITORING_ENABLED'), stateWrites:val('WRITE_STATE'), discord:val('DISCORD_MODE'), scheduler:val('SCHEDULER_MODE'), runtimeTest:val('RUNTIME_TEST_MODE'), cron:list[0].cron, discordSecret:true}));
          NODE
