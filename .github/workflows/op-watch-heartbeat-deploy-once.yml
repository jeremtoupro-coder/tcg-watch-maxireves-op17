name: OP Watch Heartbeat 10h22h Deploy One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/op-watch-heartbeat-deploy-once.yml

permissions:
  contents: read

concurrency:
  group: op-watch-production-activation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy heartbeat and prove Discord delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRODUCTION_URL: https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev
      PRODUCTION_WORKER_NAME: tcg-watch-one-piece
    steps:
      - name: Hard one-shot gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$GITHUB_EVENT_NAME" = "push" ]
          [ "${{ github.event.head_commit.message }}" = "ops: deploy heartbeat 10h22h LIVE once" ]

      - name: Checkout exact production revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Validate exact code
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          grep -q 'HEARTBEAT_PARIS_HOURS = new Set(\[10, 22\])' src/heartbeat.ts
          grep -q '/heartbeat-now' src/runtimeEntry.ts

      - name: Derive protected runtime token
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_WEBHOOK_URL; do [ -n "${!name}" ] || exit 1; done
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Generate and assert LIVE config
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_PHASE=live npm run generate-production-config
          node -e "const c=require('./wrangler.production-live.generated.json'); if(c.vars.MONITORING_ENABLED!=='true'||c.vars.WRITE_STATE!=='true'||c.vars.DISCORD_MODE!=='live'||c.vars.SCHEDULER_MODE!=='live'||c.vars.RUNTIME_TEST_MODE!=='false'||JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) process.exit(1)"

      - name: Deploy final LIVE Worker
        run: npx wrangler deploy --config wrangler.production-live.generated.json

      - name: Wait for runtime LIVE propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            raw="$(curl -sS --max-time 15 -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/runtime-ready?probe=$attempt" || true)"
            if READY_JSON="$raw" node - <<'NODE'
          try { const x=JSON.parse(process.env.READY_JSON||'{}'); process.exit(x.status==='ready'&&x.mode==='live'&&x.schedulerMode==='live'&&x.discordMode==='live'&&x.monitoringEnabled===true&&x.stateWritesEnabled===true?0:1); } catch { process.exit(1); }
          NODE
            then echo "runtime-ready LIVE PASS"; break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done

      - name: Send one real heartbeat now after a real cycle
        shell: bash
        run: |
          set -euo pipefail
          raw="$(curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" "$PRODUCTION_URL/heartbeat-now")"
          HEARTBEAT_JSON="$raw" node - <<'NODE'
          const x=JSON.parse(process.env.HEARTBEAT_JSON||'{}'); console.log(JSON.stringify(x,null,2)); process.exit(x.status==='sent'&&x.delivery?.sent===1?0:1);
          NODE

      - name: Independently confirm Cloudflare LIVE cron
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME"
          settings="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/settings")"
          schedules="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules")"
          SETTINGS_JSON="$settings" SCHEDULES_JSON="$schedules" node - <<'NODE'
          const s=JSON.parse(process.env.SETTINGS_JSON), c=JSON.parse(process.env.SCHEDULES_JSON); const b=Array.isArray(s.result?.bindings)?s.result.bindings:[]; const vars={}; for(const x of b) if(x.type==='plain_text') vars[x.name]=x.text??x.value; const rows=Array.isArray(c.result)?c.result:(c.result?.schedules||[]); const crons=rows.map(x=>x.cron).filter(Boolean); const names=new Set(b.map(x=>x.name)); const ok=vars.MONITORING_ENABLED==='true'&&vars.WRITE_STATE==='true'&&vars.DISCORD_MODE==='live'&&vars.SCHEDULER_MODE==='live'&&vars.RUNTIME_TEST_MODE==='false'&&crons.includes('* * * * *')&&names.has('DISCORD_WEBHOOK_URL'); console.log(JSON.stringify({vars:{MONITORING_ENABLED:vars.MONITORING_ENABLED,WRITE_STATE:vars.WRITE_STATE,DISCORD_MODE:vars.DISCORD_MODE,SCHEDULER_MODE:vars.SCHEDULER_MODE,RUNTIME_TEST_MODE:vars.RUNTIME_TEST_MODE},crons,discordSecretPresent:names.has('DISCORD_WEBHOOK_URL')},null,2)); process.exit(ok?0:1);
          NODE
