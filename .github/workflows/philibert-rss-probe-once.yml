name: Philibert AJAX Probe One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/philibert-rss-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "test: probe Philibert product AJAX from Cloudflare" ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Philibert product endpoints from Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/philibert-probe && cd /tmp/philibert-probe
          cat > worker.js <<'JS'
          function compact(value) { return String(value || '').replace(/\s+/g, ' ').trim(); }
          function summarize(text, contentType) {
            let jsonKeys = [];
            let jsonSignals = {};
            if ((contentType || '').includes('json') || /^[\[{]/.test(text.trim())) {
              try {
                const data = JSON.parse(text);
                jsonKeys = Object.keys(data || {});
                const pick = ['product_prices','product_cover_thumbnails','product_customization','product_details','product_variants','product_add_to_cart','product_discounts','product_refresh','id_product_attribute','product_url'];
                for (const key of pick) if (data && data[key] != null) jsonSignals[key] = compact(typeof data[key] === 'string' ? data[key] : JSON.stringify(data[key])).slice(0,500);
              } catch {}
            }
            return {
              length: text.length,
              jsonKeys,
              jsonSignals,
              hasAddToCart: /add(?:er)?\s+au\s+panier|add\s+to\s+cart|add-to-cart/i.test(text),
              hasComingSoon: /[àa]\s+venir|coming\s+soon|dispo\s*:?\s*aout/i.test(text),
              hasOutOfStock: /rupture|out\s+of\s+stock|product\.oos/i.test(text),
              hasAvailable: /disponible|in\s+stock/i.test(text),
              hasOP17: /OP[-\s]?17/i.test(text),
              prefix: compact(text).slice(0,700)
            };
          }
          export default { async fetch() {
            const base='https://www.philibertnet.com/fr/one-piece-le-jeu-de-cartes/179736-one-piece-le-jeu-de-cartes-op17-les-guerriers-les-plus-puissants-au-monde-booster-double-pack-2100001380267.html';
            const urls=[
              base,
              base+'?ajax=1&action=refresh',
              base+'?ajax=1&action=refresh&quantity_wanted=1',
              'https://www.philibertnet.com/index.php?controller=product&id_product=179736&ajax=1&action=refresh&quantity_wanted=1'
            ];
            const out=[];
            for(const url of urls){
              const started=Date.now();
              try{
                const res=await fetch(url,{headers:{
                  'User-Agent':'OPWatch/1.0 (+personal read-only stock monitor)',
                  'Accept':'application/json,text/html;q=0.9,*/*;q=0.5',
                  'Accept-Language':'fr-FR,fr;q=0.9,en;q=0.6',
                  'X-Requested-With':'XMLHttpRequest'
                }});
                const text=await res.text();
                out.push({url,status:res.status,durationMs:Date.now()-started,contentType:res.headers.get('content-type'),...summarize(text,res.headers.get('content-type'))});
              }catch(e){out.push({url,status:'fetch-error',durationMs:Date.now()-started,error:String(e)});}
            }
            return Response.json(out,{headers:{'cache-control':'no-store'}});
          }};
          JS
          cat > wrangler.jsonc <<'JSON'
          {"name":"opwatch-philibert-ajax-probe","main":"worker.js","compatibility_date":"2026-08-01","workers_dev":true}
          JSON
          npx wrangler@4.120.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          sleep 12
          url="$(grep -Eo 'https://[^ ]+workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 180 "$url" | tee /tmp/result.json
          node -e "const x=require('/tmp/result.json'); console.log(JSON.stringify(x,null,2)); if(!Array.isArray(x)||x.length!==4)process.exit(1)"
          npx wrangler@4.120.0 delete --config wrangler.jsonc --force || true
