name: Browser Fallback Probe

on:
  push:
    branches:
      - cloudflare-workers-audit

permissions:
  contents: read

jobs:
  probe-browser:
    if: contains(github.event.head_commit.message, '[browser-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate temporary SAFE browser audit config
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "true"
      - name: Inject Browser Run binding only for this test deployment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.generated.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.browser = { binding: 'BROWSER' };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Deploy temporary SAFE Browser Run probe
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate Carrefour product semantics through Browser Run
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://tcg-watch-one-piece.jeremie-touitou-pro.workers.dev';

          async function waitForDeployment() {
            for (let i = 1; i <= 15; i++) {
              const r = await fetch(base + '/');
              const d = r.ok ? await r.json() : {};
              if (d.runtime?.publicStorePollingEnabled === true) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Déploiement Browser Run non propagé.');
          }

          await waitForDeployment();
          const started = Date.now();
          const response = await fetch(`${base}/opwatch/v1/browser-probe?store=carrefour`, {
            signal: AbortSignal.timeout(90000)
          });
          const data = await response.json();
          const report = { endpointHttp: response.status, durationMs: Date.now() - started, ...data };
          const { writeFileSync } = await import('node:fs');
          writeFileSync('browser-fallback-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (!response.ok || !report.result?.usableForReadOnlyProductMonitoring) {
            throw new Error(`Carrefour Browser Run non validé: ${JSON.stringify(report.result ?? report)}`);
          }
          NODE
      - name: Upload browser probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op-watch-carrefour-browser-probe
          path: cloudflare-worker/browser-fallback-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate locked SAFE preview config
        if: always()
        run: npm run generate-deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "false"
      - name: Restore locked SAFE preview without Browser Run binding
        if: always()
        run: npx wrangler deploy --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
