name: OP Watch Cockpit Pages (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: "validate-only"
        type: choice
        options:
          - validate-only
          - deploy-pages
      confirmation:
        description: "Pour déployer Pages, saisir exactement : DEPLOYER OP WATCH PAGES"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: op-watch-public-site
  cancel-in-progress: false

jobs:
  validate:
    name: Validate cockpit without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate code and body proxy tests
        run: |
          npm run typecheck
          npm test -- tests/pages-body-proxy.test.js tests/cockpit-watch-modes-ui.test.ts
      - name: Validate cockpit JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('public-site/cockpit/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts)!=1:
              raise SystemExit(f'expected one inline cockpit script, got {len(scripts)}')
          Path('/tmp/op-watch-cockpit.js').write_text(scripts[0])
          PY
          node --check /tmp/op-watch-cockpit.js
          node --check public-site/_worker.js
          node --check public-site/cockpit-assistant.js
          node --check public-site/cockpit-web-scout.js
          node --check public-site/cockpit-auth.js

  deploy:
    name: Deploy cockpit Pages after explicit approval
    if: inputs.action == 'deploy-pages'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: op-watch-tcg-fr
    steps:
      - name: Hard deployment gate
        working-directory: .
        shell: bash
        env:
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Branche interdite::Le déploiement Pages n'est autorisé que depuis main."
            exit 1
          fi
          if [ "$REQUESTED_CONFIRMATION" != "DEPLOYER OP WATCH PAGES" ]; then
            echo "::error title=Confirmation invalide::La phrase de confirmation exacte est requise."
            exit 1
          fi
      - name: Checkout exact production revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Align Pages production branch with main
        shell: bash
        run: |
          curl -fsS --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}' \
            --output /tmp/pages-project.json
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('/tmp/pages-project.json','utf8')); if(p.success!==true||p.result?.production_branch!=='main'){console.error('Cloudflare Pages production branch was not aligned with main.'); process.exit(1)} console.log('Cloudflare Pages production branch: main')"
      - name: Deploy production Pages branch
        run: >-
          npx wrangler pages deploy public-site
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-message="OP Watch cockpit reliability"
      - name: Verify production cockpit and anonymous protection
        shell: bash
        run: |
          url="https://${PAGES_PROJECT}.pages.dev/"
          for attempt in {1..40}; do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            cockpit="$(curl -fsSL --max-time 20 "${url}cockpit/" || true)"
            authui="$(curl -fsSL --max-time 20 "${url}cockpit-auth.js" || true)"
            anon="$(curl -sS -o /tmp/cockpit-anon.json -w '%{http_code}' --max-time 15 "${url}cockpit/api/status" || true)"
            if grep -q "OP WATCH" <<<"$body" && \
               grep -q "OP Watch Cockpit" <<<"$cockpit" && \
               grep -q 'cockpit-auth.js' <<<"$cockpit" && \
               ! grep -q 'opwatch-cockpit-password\|x-op-watch-admin-password\|sessionStorage' <<<"$cockpit" && \
               grep -q 'Mot de passe oublié' <<<"$authui" && \
               [ "$anon" = "401" ]; then
              echo "Production Pages and cockpit ready: $url"
              exit 0
            fi
            sleep 3
          done
          echo "Production Pages/cockpit did not become reachable with expected content at $url" >&2
          exit 1
