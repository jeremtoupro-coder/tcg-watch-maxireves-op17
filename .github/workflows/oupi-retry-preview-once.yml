name: Oupi Retry Isolated Preview One-Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oupi-retry-preview-once.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://tcg-watch-one-piece-preview.jeremie-touitou-pro.workers.dev
    steps:
      - name: Hard gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "${{ github.event.head_commit.message }}" = "test: validate Oupi retry on isolated Cloudflare preview once" ]
      - uses: actions/checkout@v4
        with:
          ref: fix-oupi-transient-retry
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - name: Derive private preview token
        shell: bash
        run: |
          token="$(npm run --silent derive-preview-audit-token)"
          echo "::add-mask::$token"
          echo "PREVIEW_AUDIT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Generate inert preview config
        run: npm run generate-deploy-config
        env:
          DEPLOY_WORKER_NAME: tcg-watch-one-piece-preview
          DEPLOY_BIND_KV: "false"
          DEPLOY_MONITORING_ENABLED: "false"
          DEPLOY_WRITE_STATE: "false"
          DEPLOY_DISCORD_MODE: dry-run
          DEPLOY_ALLOW_PUBLIC_AUDIT: "true"
      - name: Assert preview is inert
        run: >-
          node -e "const c=require('./wrangler.generated.json'); if(c.name!=='tcg-watch-one-piece-preview'||c.vars.MONITORING_ENABLED!=='false'||c.vars.WRITE_STATE!=='false'||c.vars.DISCORD_MODE!=='dry-run'||c.vars.SCHEDULER_MODE!=='disabled'||c.triggers?.crons?.length||c.durable_objects||c.kv_namespaces?.length) process.exit(1)"
      - run: npx wrangler deploy --config wrangler.generated.json
      - run: printf '%s' "$PREVIEW_AUDIT_TOKEN" | npx wrangler secret put PREVIEW_AUDIT_TOKEN --config wrangler.generated.json
      - run: npm run stabilize-preview-auth
      - run: npm run smoke-preview
      - name: Run three isolated Oupi audits
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            curl -fsS --max-time 150 \
              -H "Authorization: Bearer $PREVIEW_AUDIT_TOKEN" \
              "$PREVIEW_URL/audit?store=oupi" > "/tmp/oupi-$i.json"
            I="$i" node - <<'NODE'
          const i=process.env.I;
          const x=require(`/tmp/oupi-${i}.json`);
          const s=x.stores?.[0];
          const out={attempt:i,runtimeStatus:s?.runtimeStatus,candidates:s?.candidates?.length,errors:(s?.sources||[]).flatMap(v=>v.error?[v.error]:[]),latencyMs:(s?.sources||[]).reduce((n,v)=>n+(v.durationMs||0),0)};
          console.log(JSON.stringify(out,null,2));
          if(!s||s.runtimeStatus!=='healthy') process.exit(2);
          NODE
            sleep 2
          done
