name: TCG Watch - Production Monitor

on:
  schedule:
    # GitHub Actions utilise UTC. Exécution demandée toutes les 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - baseline
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch-maxireves.yml"
      - "cloudflare-worker/config/**"
      - "cloudflare-worker/src/**"
      - "cloudflare-worker/scripts/poll.ts"
      - "cloudflare-worker/package.json"

permissions:
  contents: read

concurrency:
  group: tcg-watch-production-monitor
  # Évite les files d'attente et les doublons si un contrôle dépasse 5 minutes.
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package.json

      - name: Verify required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret manquant::$name n'est pas configuré dans GitHub Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate code on configuration changes
        if: github.event_name == 'push'
        run: |
          npm run typecheck
          npm test

      - name: Monitor every configured store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: npm run monitor

      - name: Publish monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report-${{ github.run_id }}
          path: cloudflare-worker/monitor-report.json
          if-no-files-found: warn
          retention-days: 14
