name: OP Watch - Production Monitor (gated)

on:
  schedule:
    # GitHub Actions utilise UTC. Exécution demandée toutes les 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "baseline"
        type: choice
        options:
          - live
          - baseline
  repository_dispatch:
    types:
      - op-watch-fast-watch

permissions:
  contents: read

concurrency:
  group: tcg-watch-production-monitor
  # Évite les files d'attente et les doublons si un contrôle dépasse 5 minutes.
  cancel-in-progress: true

jobs:
  monitor:
    if: vars.OP_WATCH_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify required production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret manquant::$name n'est pas configuré dans GitHub Actions."
              missing=1
            fi
          done
          if [ "$MONITOR_MODE" = "live" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error title=Secret manquant::DISCORD_WEBHOOK_URL n'est pas configuré."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Monitor every configured store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE: tcg-watch-state
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUTHORIZED_FEED_PLAYIN_URL: ${{ secrets.AUTHORIZED_FEED_PLAYIN_URL }}
          AUTHORIZED_FEED_CULTURA_URL: ${{ secrets.AUTHORIZED_FEED_CULTURA_URL }}
          AUTHORIZED_FEED_MICROMANIA_URL: ${{ secrets.AUTHORIZED_FEED_MICROMANIA_URL }}
          AUTHORIZED_FEED_FNAC_URL: ${{ secrets.AUTHORIZED_FEED_FNAC_URL }}
          AUTHORIZED_FEED_CARREFOUR_URL: ${{ secrets.AUTHORIZED_FEED_CARREFOUR_URL }}
          AUTHORIZED_FEED_KING_JOUET_URL: ${{ secrets.AUTHORIZED_FEED_KING_JOUET_URL }}
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: npm run monitor

      - name: Publish monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report-${{ github.run_id }}
          path: cloudflare-worker/monitor-report.json
          if-no-files-found: warn
          retention-days: 14
