name: King Cataleeze Probe

on:
  push:
    branches: [cloudflare-workers-audit]

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-king-cataleeze]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe documented Cataleeze endpoints
        run: npx tsx scripts/probe-king-cataleeze.ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: king-cataleeze-probe
          path: cloudflare-worker/king-cataleeze-probe.json
          retention-days: 7
