name: OP Watch Live Bootstrap (one-off)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-live-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    name: Enable and dispatch guarded production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable workflow and dispatch authorized LIVE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: "293939743"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsS -X PUT "${auth[@]}" "${api}/actions/workflows/${WORKFLOW_ID}/enable" >/dev/null
          curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
            "${api}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -d '{"ref":"main","inputs":{"action":"activate-live","confirmation":"ACTIVER OP WATCH LIVE"}}' >/dev/null

          echo "OP Watch production workflow enabled and LIVE dispatch accepted."
