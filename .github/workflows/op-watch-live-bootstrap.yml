name: OP Watch Live Bootstrap (one-off)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/op-watch-live-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    name: Enable and dispatch guarded production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable production gate, workflow and dispatch LIVE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: "293939743"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          code="$(curl -sS -o /tmp/opwatch-var.json -w '%{http_code}' "${auth[@]}" "${api}/actions/variables/OP_WATCH_PRODUCTION_ENABLED")"
          if [ "$code" = "200" ]; then
            curl -fsS -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
              "${api}/actions/variables/OP_WATCH_PRODUCTION_ENABLED" \
              -d '{"name":"OP_WATCH_PRODUCTION_ENABLED","value":"true"}' >/dev/null
          elif [ "$code" = "404" ]; then
            curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              "${api}/actions/variables" \
              -d '{"name":"OP_WATCH_PRODUCTION_ENABLED","value":"true"}' >/dev/null
          else
            cat /tmp/opwatch-var.json
            echo "Unexpected variable API HTTP ${code}" >&2
            exit 1
          fi

          curl -fsS -X PUT "${auth[@]}" "${api}/actions/workflows/${WORKFLOW_ID}/enable" >/dev/null

          curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
            "${api}/actions/workflows/${WORKFLOW_ID}/dispatches" \
            -d '{"ref":"main","inputs":{"action":"activate-live","confirmation":"ACTIVER OP WATCH LIVE"}}' >/dev/null

          echo "OP Watch production workflow enabled and LIVE dispatch accepted."
